<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        /* ===== LIGHT & DARK THEME ===== */
        :root {
            --bg: #f9fafb;
            --card: #ffffff;
            --text: #111827;
            --border: #e5e7eb;
            --muted: #6b7280;
            --shadow: 0 2px 8px rgba(0,0,0,0.02);
            --hover-bg: #f3f4f6;
            --primary: #008751;
            --primary-light: #E8F5E9;
            --primary-dark: #006d3f;
            --input-bg: #ffffff;
            --input-border: #d1d5db;
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
            --muted: #94a3b8;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --hover-bg: #2d3748;
            --input-bg: #2d3748;
            --input-border: #4a5568;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        /* ===== MODAL STYLES ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 1rem;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--card);
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            padding: 1.75rem 2rem 1.5rem;
            box-shadow: 0 24px 60px rgba(0,0,0,0.25);
            animation: fadeIn 0.25s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        .modal-header .icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.2rem;
        }
        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            margin: 0;
        }
        .modal-subtitle {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 1rem;
        }
        .modal-divider {
            border-top: 1px solid var(--border);
            margin: 0.75rem 0;
        }
        .modal-row {
            display: flex;
            justify-content: space-between;
            padding: 0.3rem 0;
            font-size: 0.9rem;
        }
        .modal-row .label { color: var(--muted); font-weight: 500; }
        .modal-row .value { font-weight: 600; color: var(--text); }
        .modal-status-badge {
            display: inline-block;
            padding: 0.15rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .modal-status-badge.present { background: #d1fae5; color: #065f46; }
        .modal-status-badge.late { background: #fef3c7; color: #92400e; }
        .modal-status-badge.absent { background: #fee2e2; color: #991b1b; }
        .modal-status-badge.grace { background: #fef3c7; color: #92400e; }
        .modal-status-badge.pending { background: #f3f4f6; color: #6b7280; }
        .modal-grace-warning {
            background: #fef3c7;
            border-left: 4px solid #eab308;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #92400e;
            margin-bottom: 0.5rem;
        }
        body.dark .modal-grace-warning { background: #422b00; color: #fbbf24; border-left-color: #f59e0b; }

        .modal-session-closed {
            background: #fef3c7;
            border-left: 4px solid #eab308;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #92400e;
            margin-bottom: 0.75rem;
        }
        .modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            margin-top: 1.25rem;
            flex-wrap: wrap;
        }
        .modal-actions .btn {
            padding: 0.4rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-size: 0.9rem;
        }
        .modal-actions .btn:hover { transform: translateY(-1px); }
        .modal-actions .btn-primary { background: var(--primary); color: white; }
        .modal-actions .btn-primary:hover { background: var(--primary-dark); }
        .modal-actions .btn-secondary { background: var(--border); color: var(--text); }
        .modal-actions .btn-secondary:hover { opacity: 0.8; }
        .modal-actions .btn-danger { background: #e53e3e; color: white; }
        .modal-actions .btn-danger:hover { background: #c53030; }
        .modal-actions .btn-success { background: #48bb78; color: white; }
        .modal-actions .btn-success:hover { background: #38a169; }
        .modal-actions .btn-warning { background: #eab308; color: white; }
        .modal-actions .btn-warning:hover { background: #ca8a04; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100%;
            background: var(--card);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            z-index: 100;
            transition: background 0.3s, border 0.3s, transform 0.3s ease;
        }
        .sidebar .brand { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 2rem; }
        .sidebar .brand span { font-weight: 300; color: var(--text); }
        .sidebar nav a {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.6rem 1rem; border-radius: 10px;
            color: var(--text); text-decoration: none;
            transition: background 0.2s, color 0.2s;
            font-size: 0.95rem;
        }
        .sidebar nav a:hover { background: var(--primary-light); color: var(--primary); }
        .sidebar nav a.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .sidebar nav a i { width: 1.25rem; text-align: center; }
        .sidebar .logout-btn, .sidebar .theme-toggle {
            margin-top: 0.5rem;
            width: 100%;
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.6rem 1rem; border-radius: 10px;
            background: none; border: none; cursor: pointer;
            font-size: 0.95rem; color: var(--text);
            transition: background 0.2s;
        }
        .sidebar .logout-btn:hover { background: #fee2e2; color: #dc2626; }
        .sidebar .theme-toggle:hover { background: var(--hover-bg); }
        .sidebar-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 99;
            display: none;
        }
        .sidebar-overlay.active { display: block; }

        /* ===== MAIN ===== */
        .main-content {
            margin-left: 260px;
            padding: 1.5rem 2rem;
            min-height: 100vh;
            transition: background 0.3s;
        }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--primary-light);
        }
        .topbar .menu-toggle {
            display: none;
            background: none; border: none; font-size: 1.5rem;
            color: var(--text); cursor: pointer; padding: 0.25rem 0.5rem;
        }

        /* ===== NOTIFICATION BELL ===== */
        .notif-wrapper { position: relative; }
        .notif-wrapper .bell-btn {
            background: none; border: none; font-size: 1.3rem;
            color: var(--text); cursor: pointer; padding: 0.4rem;
            border-radius: 50%; transition: background 0.2s;
        }
        .notif-wrapper .bell-btn:hover { background: var(--primary-light); }
        .notif-badge {
            position: absolute; top: -4px; right: -4px;
            background: #ef4444; color: white; font-size: 0.6rem;
            font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 999px;
            display: none;
        }
        .notif-badge.show { display: inline-block; }
        .notif-dropdown {
            position: absolute; right: 0; top: 2.8rem; width: 320px;
            max-height: 400px; overflow-y: auto;
            background: var(--card); border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            border: 1px solid var(--border); display: none; z-index: 50;
        }
        .notif-dropdown.active { display: block; }
        .notif-item {
            padding: 0.75rem 1rem; border-bottom: 1px solid var(--border);
            cursor: default;
        }
        .notif-item.unread { background: var(--primary-light); border-left: 3px solid var(--primary); }
        .notif-item .title { font-weight: 600; font-size: 0.9rem; color: var(--text); }
        .notif-item .msg { font-size: 0.8rem; color: var(--muted); margin-top: 0.1rem; }
        .notif-item .time { font-size: 0.65rem; color: var(--muted); margin-top: 0.2rem; }
        .notif-item .mark-read { font-size: 0.65rem; color: var(--primary); cursor: pointer; float: right; }
        .notif-empty { padding: 1.5rem; text-align: center; color: var(--muted); }

        /* ===== ATTENDANCE SPECIFIC ===== */
        #reader { width:100%; max-width:400px; margin:0 auto; }
        .session-status-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1rem 1.25rem;
            box-shadow: var(--shadow);
            transition: background 0.3s, border 0.3s;
        }
        .session-status-card .status-text { font-weight: 500; color: var(--text); }
        .scanner-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: background 0.3s, border 0.3s;
        }
        .attendance-table-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: background 0.3s, border 0.3s;
        }
        .attendance-table-card .table-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .attendance-table-card .table-title .title-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .attendance-table-card .overflow-x-auto {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .attendance-table-card table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            color: var(--text);
            min-width: 400px;
        }
        .attendance-table-card th {
            text-align: left;
            padding: 0.6rem 0.5rem;
            font-weight: 600;
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 2px solid var(--border);
        }
        .attendance-table-card td {
            padding: 0.6rem 0.5rem;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }
        .attendance-table-card tr:hover { background: var(--hover-bg); }
        .input-field {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            width: 100%;
            font-size: 0.9rem;
            transition: border 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,135,81,0.15);
        }
        .btn-primary-custom {
            background: var(--primary);
            color: white;
            padding: 0.5rem 1.25rem;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary-custom:hover { background: var(--primary-dark); }
        .btn-danger-custom {
            background: #dc2626;
            color: white;
            padding: 0.5rem 1.25rem;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }
        .btn-danger-custom:hover { background: #b91c1c; }
        .btn-secondary-custom {
            background: var(--border);
            color: var(--text);
            padding: 0.5rem 1.25rem;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }
        .btn-secondary-custom:hover { opacity: 0.8; }
        .badge-status {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge-present { background: #d1fae5; color: #065f46; }
        .badge-late { background: #fef3c7; color: #92400e; }
        .badge-absent { background: #fee2e2; color: #991b1b; }
        .badge-pending { background: #f3f4f6; color: #6b7280; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 75%; max-width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 1rem; }
            .topbar .menu-toggle { display: block; }
            .notif-dropdown { width: 280px; right: -0.5rem; }
            .attendance-table-card table { font-size: 0.8rem; min-width: 320px; }
            .attendance-table-card th, .attendance-table-card td { padding: 0.4rem 0.4rem; }
            .attendance-table-card .table-title { flex-direction: column; align-items: flex-start; }
            .modal-box { padding: 1rem; margin: 0.5rem; }
            .modal-row { flex-direction: column; padding: 0.4rem 0; }
            .modal-row .label { width: 100%; }
            .modal-row .value { width: 100%; }
            .session-status-card { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        }
        @media (min-width: 769px) { .sidebar-overlay { display: none !important; } }

        .text-primary { color: var(--primary); }
        .text-muted { color: var(--muted); }
        .flex-center { display: flex; align-items: center; gap: 0.5rem; }
        .font-bold { font-weight: 700; }
        .text-xl { font-size: 1.25rem; }
        .text-sm { font-size: 0.875rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mt-4 { margin-top: 1rem; }
        .gap-2 { gap: 0.5rem; }
        .flex-wrap { flex-wrap: wrap; }
        .hidden { display: none; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#E8F5E9', 100: '#C8E6C9', 200: '#A5D6A7',
                            300: '#81C784', 400: '#66BB6A', 500: '#008751',
                            600: '#007A48', 700: '#006D3F', 800: '#005B34', 900: '#004A2A'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="brand">Course<span>Mate</span></div>
        <nav>
            <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
            <a href="students.html"><i class="fas fa-users"></i> Students</a>
            <a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
            <a href="attendance.html" class="active"><i class="fas fa-clipboard-list"></i> Attendance</a>
            <a href="analytics.html"><i class="fas fa-chart-bar"></i> Progress</a>
            <a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a>
            <a href="settings.html" id="settingsLink"><i class="fas fa-cog"></i> Settings</a>
            <a href="super-settings.html" id="superSettingsLink" style="display: none;">
                <i class="fas fa-crown"></i> Super Admin
            </a>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()">
            <i class="fas fa-moon"></i> Dark Mode
        </button>
        <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </aside>

    <!-- ===== MAIN ===== -->
    <div class="main-content">
        <div class="topbar">
            <div class="flex-center">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 class="text-xl font-bold" style="margin:0;">Attendance</h1>
            </div>
            <div class="flex-center flex-wrap gap-2">
                <!-- Notification Bell -->
                <div class="notif-wrapper">
                    <button class="bell-btn" id="notificationBell">
                        <i class="fas fa-bell"></i>
                    </button>
                    <span class="notif-badge" id="unreadBadge">0</span>
                    <div class="notif-dropdown" id="notificationDropdown">
                        <div id="notificationList"><div class="notif-empty">No notifications</div></div>
                    </div>
                </div>
                <!-- Test Mode Toggle -->
                <label class="text-sm text-gray-600 flex items-center gap-2 bg-white px-3 py-1 rounded-full border border-gray-200">
                    <input type="checkbox" id="testMode" class="rounded border-gray-300 text-primary-500 focus:ring-primary-500" />
                    Test Mode
                </label>
                <button id="startSessionBtn" onclick="toggleSession()" class="btn-primary-custom">
                    <i class="fas fa-play mr-2"></i>Start Session
                </button>
            </div>
        </div>

        <!-- Session Status -->
        <div class="session-status-card mb-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="sessionIndicator" class="w-3 h-3 rounded-full bg-gray-400"></div>
                <span id="sessionStatusText" class="font-medium text-gray-600">No active session</span>
            </div>
            <span id="sessionTime" class="text-sm text-gray-500">—</span>
        </div>

        <!-- Scanner & Manual Check-in -->
        <div id="scannerContainer" class="hidden scanner-card mb-4">
            <div id="reader"></div>
            <div class="mt-4 text-center flex flex-wrap gap-3 justify-center">
                <button onclick="requestCameraPermission()" class="btn-primary-custom"><i class="fas fa-camera mr-2"></i>Request Camera</button>
                <button onclick="stopScanner()" class="btn-danger-custom"><i class="fas fa-stop mr-2"></i>Stop</button>
                <button onclick="restartScanner()" class="btn-secondary-custom"><i class="fas fa-sync-alt mr-2"></i>Restart</button>
            </div>
            <div id="scanResult" class="mt-4 text-center text-sm text-gray-600"></div>

            <!-- Manual Check-in -->
            <div class="mt-6 pt-6 border-t border-gray-200">
                <p class="text-sm font-medium text-gray-700 mb-2">Manual Check-in</p>
                <div class="flex flex-wrap gap-3">
                    <input type="text" id="manualStudentId" placeholder="Enter Student ID (e.g., CMT2026001)" class="input-field flex-1" />
                    <button onclick="manualCheckin()" class="btn-primary-custom"><i class="fas fa-check mr-2"></i>Check</button>
                </div>
            </div>
        </div>

        <!-- Attendance List -->
        <div class="attendance-table-card">
            <div class="table-title">
                <div class="title-left">
                    <i class="fas fa-list text-primary"></i> Today's Attendance
                    <span id="attendanceCount" class="text-sm font-normal text-muted ml-2">(0 students)</span>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table>
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Check-in Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr><td colspan="3" class="text-center text-gray-400 py-4">No attendance recorded today.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div id="modal-content">
                <!-- dynamically filled -->
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>

    <script>
        // ============================================================
        // ADMIN ATTENDANCE – Full Logic with Modals & Notifications
        // ============================================================

        // ---------- MODAL FUNCTIONS ----------
        function showModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============================================================
        // SIDEBAR TOGGLE
        // ============================================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) closeSidebar();
        });

        // ============================================================
        // DARK MODE
        // ============================================================
        function loadTheme() {
            const dark = localStorage.getItem('theme') === 'dark';
            document.body.classList.toggle('dark', dark);
            const icon = document.querySelector('.theme-toggle i');
            if (icon) icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const icon = document.querySelector('.theme-toggle i');

        // ---------- Determine status with expiry & grace ----------
        function getAttendanceStatus(student, checkInTime) {
            const testMode = document.getElementById('testMode').checked;
            if (testMode) return { status: 'present', message: 'Test Mode – Present', blocked: false };

            const hours = checkInTime.getHours();
            const minutes = checkInTime.getMinutes();
            const current = hours * 60 + minutes;
            const start = classStartHour * 60 + classStartMinute;
            const graceEnd = start + graceMinutes;
            const end = classEndHour * 60 + classEndMinute;

            if (current < start) return { status: 'pending', message: 'Class not started', blocked: true };
            if (current > end) return { status: 'absent', message: 'Class ended', blocked: true };

            let timeStatus = (current <= graceEnd) ? 'present' : 'late';

            if (student.payment_status === 'paid') {
                return { status: timeStatus, message: 'Active (Full)', blocked: false };
            }

            if (student.payment_status === 'monthly_active') {
                if (!student.expires_at) {
                    return { status: timeStatus, message: 'Active (Monthly)', blocked: false };
                }
                const now = new Date();
                const expires = new Date(student.expires_at);
                const graceEndDate = new Date(expires);
                graceEndDate.setDate(graceEndDate.getDate() + graceDays);

                if (now <= expires) {
                    return { status: timeStatus, message: 'Active', blocked: false };
                } else if (now > expires && now <= graceEndDate) {
                    return { status: timeStatus, message: '⚠️ Grace Period – Please renew soon', blocked: false, grace: true };
                } else {
                    return { status: 'absent', message: 'Expired – Payment required', blocked: true };
                }
            }
            return { status: 'absent', message: 'Payment invalid', blocked: true };
        }

                `);
            } else {
                // END SESSION
                btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Ending...';
                btn.disabled = true;
                
                indicator.className = 'w-3 h-3 rounded-full bg-gray-400';
                statusText.textContent = 'Closing session...';
                document.getElementById('sessionTime').textContent = '—';
                scannerContainer.classList.add('hidden');
                stopScanner();

                try {
                    // Show summary
                    await showEndSessionSummary();
                    
                    // Send notifications
                    await sendNotifications();

                    // ✅ INSERT INTO EMAIL_LOGS TO LOCK THE SESSION
                    const { error: insertError } = await window.supabaseClient
                        .from('email_logs')
                        .insert({ 
                            session_date: today, 
                            recipient_type: 'admin' 
                        });

                    if (insertError) {
                        console.error('❌ Failed to insert email_logs entry:', insertError);
                    } else {
                        console.log('✅ Email_logs entry inserted successfully.');
                    }

                    // ✅ RELOAD NOTIFICATIONS TO SHOW ADMIN ALERTS
                    await loadNotifications();

                    // Update button to show closed state
                    btn.innerHTML = '<i class="fas fa-lock mr-2"></i>Session Closed';
                    btn.className = 'btn-secondary-custom';
                    btn.disabled = true;
                    btn.style.opacity = '0.6';
                    btn.style.cursor = 'not-allowed';
                    statusText.textContent = 'Session Closed';
                    indicator.className = 'w-3 h-3 rounded-full bg-gray-400';

                } catch (err) {
                    console.error('❌ Error ending session:', err);
                    btn.innerHTML = '<i class="fas fa-play mr-2"></i>Start Session';
                    btn.className = 'btn-primary-custom';
                    btn.disabled = false;
                    statusText.textContent = 'No active session';
                    indicator.className = 'w-3 h-3 rounded-full bg-gray-400';
                    
                    showModal(`
                        <div class="modal-header">
                            <div class="icon"><i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i></div>
                            <div class="modal-title">Error Ending Session</div>
                        </div>
                        <div class="modal-subtitle">There was an error ending the session. Please try again.</div>
                        <div class="modal-actions">
                            <button onclick="closeModal()" class="btn btn-secondary">OK</button>
                        </div>
                    `);
                }
            }
            await loadTodayAttendance();
        };

        // ---------- End Session Summary ----------
        async function showEndSessionSummary() {
            try {
                const { data: allStudents, error: stuErr } = await window.supabaseClient
                    .from('students')
                    .select('id, full_name, student_id')
                    .in('payment_status', ['paid', 'monthly_active']);

                if (stuErr) throw stuErr;
                const total = allStudents ? allStudents.length : 0;

                const { data: attendance, error: attErr } = await window.supabaseClient
                    .from('attendance')
                    .select('student_id, status')
                    .eq('session_date', today);

                if (attErr) throw attErr;

                const present = attendance ? attendance.filter(a => a.status === 'present').length : 0;
                const late = attendance ? attendance.filter(a => a.status === 'late').length : 0;
                const checkedIn = attendance ? attendance.length : 0;
                const absent = total - checkedIn;

                const attendedIds = attendance ? attendance.map(a => a.student_id) : [];
                const absentStudents = allStudents ? allStudents.filter(s => !attendedIds.includes(s.id)) : [];

                let absentList = '';
                if (absentStudents.length > 0) {
                    absentList = `<div style="margin-top:0.5rem; max-height:150px; overflow-y:auto; font-size:0.85rem;">`;
                    absentStudents.forEach(s => {
                        absentList += `<div>• ${s.full_name} (${s.student_id})</div>`;
                    });
                    absentList += `</div>`;
                } else {
                    absentList = `<div style="margin-top:0.5rem; color:#48bb78;">All active students were present today.</div>`;
                }

                showModal(`
                    <div class="modal-header"><div class="icon"><i class="fas fa-chart-bar"></i></div><div class="modal-title">Session Summary</div></div>
                    <div class="modal-subtitle">Attendance report for ${today}</div>
                    <div class="modal-row"><span class="label">Total Active Students</span><span class="value">${total}</span></div>
                    <div class="modal-row"><span class="label">Present</span><span class="value">${present}</span></div>
                    <div class="modal-row"><span class="label">Late</span><span class="value">${late}</span></div>
                    <div class="modal-row"><span class="label">Absent</span><span class="value">${absent}</span></div>
                    <div class="modal-divider"></div>
                    <div style="font-weight:600; color:var(--text); margin-bottom:0.25rem;">Absent Students</div>
                    ${absentList}
                    <div class="modal-actions"><button onclick="closeModal()" class="btn btn-primary">Close</button></div>
                `);
            } catch (err) {
                console.error('Summary error:', err);
                showModal(`
                    <div class="modal-header"><div class="icon"><i class="fas fa-chart-bar"></i></div><div class="modal-title">Session Ended</div></div>
                    <div class="modal-subtitle">Attendance session closed.</div>
                    <div class="modal-actions"><button onclick="closeModal()" class="btn btn-secondary">OK</button></div>
                `);
            }
        }

        // ---------- Load Today's Attendance ----------
        async function loadTodayAttendance() {
            try {
                const { data: records, error } = await window.supabaseClient
                    .from('attendance')
                    .select('*, students(full_name)')
                    .eq('session_date', today)
                    .order('check_in_time', { ascending: true });

                if (error) throw error;

                const tbody = document.getElementById('attendanceTableBody');
                const countEl = document.getElementById('attendanceCount');

                if (!records || records.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="text-center text-gray-400 py-4">No attendance recorded today.</td></tr>`;
                    countEl.textContent = '(0 students)';
                    return;
                }

                countEl.textContent = `(${records.length} students)`;

                tbody.innerHTML = records.map(rec => `
                    <tr>
                        <td class="py-2 font-medium">${rec.students?.full_name || 'Unknown'}</td>
                        <td class="py-2">${rec.check_in_time || '—'}</td>
                        <td class="py-2">
                            <span class="badge-status ${rec.status === 'present' ? 'badge-present' : rec.status === 'late' ? 'badge-late' : 'badge-absent'}">
                                ${rec.status.charAt(0).toUpperCase() + rec.status.slice(1)}
                            </span>
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error('Load attendance error:', error);
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-red-500 py-4">Failed to load attendance.</td></tr>`;
            }
        }

        // ---------- Init ----------
        document.addEventListener('DOMContentLoaded', async function() {
            await updateSidebarForRole();
            await loadSettings();
            await loadTodayAttendance();
            await loadNotifications();
            await checkSessionStatus();

            try {
                const user = await window.auth.requireAuth('../login.html');
                if (!user) return;
                const role = user.user_metadata?.role || 'student';
                if (role !== 'admin') {
                    showModal(`
                        <div class="modal-header">
                            <div class="icon"><i class="fas fa-lock" style="color:#ef4444;"></i></div>
                            <div class="modal-title">Access Denied</div>
                        </div>
                        <div class="modal-subtitle">This page is for admins only.</div>
                        <div class="modal-actions">
                            <button onclick="window.location.href='../student/dashboard.html'" class="btn btn-secondary">Go to Dashboard</button>
                        </div>
                    `);
                    return;
                }
                const nameEl = document.getElementById('adminName');
                if (nameEl) {
                    nameEl.textContent = user.user_metadata?.full_name || user.email?.split('@')[0] || 'Admin';
                }
            } catch (e) {
                console.error('Auth error:', e);
            }
        });
    </script>
</body>
</html>
