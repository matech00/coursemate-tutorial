<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="assets/images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== LIGHT & DARK THEME ===== */
        :root {
            --bg: #f9fafb;
            --card: #ffffff;
            --text: #111827;
            --border: #e5e7eb;
            --muted: #6b7280;
            --shadow: 0 2px 8px rgba(0,0,0,0.02);
            --hover-bg: #f3f4f6;
            --primary: #008751;
            --primary-light: #E8F5E9;
            --primary-dark: #006d3f;
            --input-bg: #ffffff;
            --input-border: #d1d5db;
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
            --muted: #94a3b8;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --hover-bg: #2d3748;
            --input-bg: #2d3748;
            --input-border: #4a5568;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100%;
            background: var(--card);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            z-index: 100;
            transition: background 0.3s, border 0.3s, transform 0.3s ease;
        }
        .sidebar .brand { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 2rem; }
        .sidebar .brand span { font-weight: 300; color: var(--text); }
        .sidebar nav a {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.6rem 1rem; border-radius: 10px;
            color: var(--text); text-decoration: none;
            transition: background 0.2s, color 0.2s;
            font-size: 0.95rem;
        }
        .sidebar nav a:hover { background: var(--primary-light); color: var(--primary); }
        .sidebar nav a.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .sidebar nav a i { width: 1.25rem; text-align: center; }
        .sidebar .logout-btn, .sidebar .theme-toggle {
            margin-top: 0.5rem;
            width: 100%;
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.6rem 1rem; border-radius: 10px;
            background: none; border: none; cursor: pointer;
            font-size: 0.95rem; color: var(--text);
            transition: background 0.2s;
        }
        .sidebar .logout-btn:hover { background: #fee2e2; color: #dc2626; }
        .sidebar .theme-toggle:hover { background: var(--hover-bg); }
        .sidebar-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 99;
            display: none;
        }
        .sidebar-overlay.active { display: block; }

        /* ===== MAIN ===== */
        .main-content {
            margin-left: 260px;
            padding: 1.5rem 2rem;
            min-height: 100vh;
            transition: background 0.3s;
        }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--primary-light);
        }
        .topbar .menu-toggle {
            display: none;
            background: none; border: none; font-size: 1.5rem;
            color: var(--text); cursor: pointer; padding: 0.25rem 0.5rem;
        }

        /* ===== NOTIFICATION BELL ===== */
        .notif-wrapper { position: relative; }
        .notif-wrapper .bell-btn {
            background: none; border: none; font-size: 1.3rem;
            color: var(--text); cursor: pointer; padding: 0.4rem;
            border-radius: 50%; transition: background 0.2s;
        }
        .notif-wrapper .bell-btn:hover { background: var(--primary-light); }
        .notif-badge {
            position: absolute; top: -4px; right: -4px;
            background: #ef4444; color: white; font-size: 0.6rem;
            font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 999px;
            display: none;
        }
        .notif-badge.show { display: inline-block; }
        .notif-dropdown {
            position: absolute; right: 0; top: 2.8rem; width: 320px;
            max-height: 400px; overflow-y: auto;
            background: var(--card); border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            border: 1px solid var(--border); display: none; z-index: 50;
        }
        .notif-dropdown.active { display: block; }
        .notif-item {
            padding: 0.75rem 1rem; border-bottom: 1px solid var(--border);
            cursor: default;
        }
        .notif-item.unread { background: var(--primary-light); border-left: 3px solid var(--primary); }
        .notif-item .title { font-weight: 600; font-size: 0.9rem; color: var(--text); }
        .notif-item .msg { font-size: 0.8rem; color: var(--muted); margin-top: 0.1rem; }
        .notif-item .time { font-size: 0.65rem; color: var(--muted); margin-top: 0.2rem; }
        .notif-item .mark-read { font-size: 0.65rem; color: var(--primary); cursor: pointer; float: right; }
        .notif-empty { padding: 1.5rem; text-align: center; color: var(--muted); }

        /* ===== STUDENT TABLE ===== */
        .table-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: background 0.3s, border 0.3s;
        }
        .table-card .table-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .table-card .table-title .title-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .table-card .table-title .title-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-download {
            background: var(--primary);
            color: white;
            padding: 0.3rem 0.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-download:hover {
            background: var(--primary-dark);
        }

        .badge-status {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge-paid { background: #d1fae5; color: #065f46; }
        .badge-monthly { background: #fef3c7; color: #92400e; }
        .badge-expired { background: #fee2e2; color: #991b1b; }
        .badge-pending { background: #f3f4f6; color: #6b7280; }

        /* ===== INPUTS ===== */
        .input-field {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text);
            border-radius: 8px;
            padding: 0.4rem 0.75rem;
            font-size: 0.9rem;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,135,81,0.15);
        }
        .filter-select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text);
            border-radius: 8px;
            padding: 0.4rem 0.75rem;
            font-size: 0.9rem;
        }
        .filter-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,135,81,0.15);
        }

        .btn-primary-sm {
            background: var(--primary);
            color: white;
            padding: 0.3rem 0.8rem;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary-sm:hover { background: var(--primary-dark); }
        .btn-secondary-sm {
            background: var(--border);
            color: var(--text);
            padding: 0.3rem 0.8rem;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-secondary-sm:hover { background: var(--hover-bg); }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 1rem;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--card);
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem 2rem 1.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-box .modal-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
        }
        .modal-box .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--muted);
            transition: color 0.2s;
        }
        .modal-box .modal-header .close-btn:hover { color: var(--text); }
        .modal-row {
            display: flex;
            padding: 0.3rem 0;
            border-bottom: 1px solid var(--border);
        }
        .modal-row .label {
            width: 40%;
            font-weight: 500;
            color: var(--muted);
        }
        .modal-row .value {
            width: 60%;
            color: var(--text);
            font-weight: 500;
        }
        .modal-section-title {
            font-weight: 600;
            color: var(--text);
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            padding-bottom: 0.3rem;
            border-bottom: 2px solid var(--primary-light);
        }
        .attendance-item {
            display: flex;
            justify-content: space-between;
            padding: 0.2rem 0;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
        }
        .attendance-item .date { color: var(--muted); }
        .attendance-item .status { font-weight: 500; }
        .attendance-item .status.present { color: #22c55e; }
        .attendance-item .status.late { color: #eab308; }
        .attendance-item .status.absent { color: #ef4444; }

        /* ===== RESPONSIVE ===== */
        .search-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .search-filters .flex-1 { flex: 1; min-width: 150px; }

        /* ===== RESPONSIVE TABLE - DESKTOP ===== */
        .table-card .overflow-x-auto {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .table-card table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            color: var(--text);
        }
        .table-card table thead {
            display: table-header-group;
        }
        .table-card table thead th {
            text-align: left;
            padding: 0.6rem 0.5rem;
            font-weight: 600;
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 2px solid var(--border);
        }
        .table-card table tbody tr {
            display: table-row;
        }
        .table-card table tbody tr td {
            display: table-cell;
            padding: 0.6rem 0.5rem;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }
        .table-card table tbody tr td::before {
            display: none;
        }
        .table-card table tbody tr:hover {
            background: var(--hover-bg);
        }

        /* ===== MOBILE CARD VIEW ===== */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 75%; max-width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 1rem; }
            .topbar .menu-toggle { display: block; }
            .notif-dropdown { width: 280px; right: -0.5rem; }
            
            .search-filters {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }
            .search-filters .flex-1 { min-width: 100%; }

            .table-card .table-title {
                flex-direction: column;
                align-items: flex-start;
            }
            .table-card .table-title .title-right {
                width: 100%;
            }
            .table-card .table-title .title-right .btn-download {
                width: 100%;
                justify-content: center;
            }

            .table-card table thead {
                display: none;
            }
            
            .table-card table tbody tr {
                display: block;
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 0.75rem;
                margin-bottom: 0.75rem;
                background: var(--card);
                box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            }
            
            .table-card table tbody tr td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.3rem 0;
                border-bottom: 1px solid var(--border);
                font-size: 0.85rem;
            }
            
            .table-card table tbody tr td:last-child {
                border-bottom: none;
            }
            
            .table-card table tbody tr td::before {
                content: attr(data-label);
                font-weight: 600;
                color: var(--muted);
                font-size: 0.65rem;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }
            
            .table-card table tbody tr td:first-child {
                font-size: 1rem;
                font-weight: 600;
                color: var(--text);
                border-bottom: 2px solid var(--primary-light);
                padding-bottom: 0.4rem;
                margin-bottom: 0.2rem;
            }
            
            .table-card table tbody tr td:first-child::before {
                display: none;
            }
            
            .table-card table tbody tr td .badge-status {
                font-size: 0.65rem;
                padding: 0.1rem 0.5rem;
            }

            .table-card table tbody tr td .btn-primary-sm {
                font-size: 0.75rem;
                padding: 0.2rem 0.6rem;
            }

            .modal-box {
                padding: 1rem;
                margin: 0.5rem;
            }
            .modal-row {
                flex-direction: column;
                padding: 0.4rem 0;
            }
            .modal-row .label {
                width: 100%;
            }
            .modal-row .value {
                width: 100%;
            }
        }

        @media (min-width: 769px) { 
            .sidebar-overlay { display: none !important; } 
        }

        .text-primary { color: var(--primary); }
        .text-muted { color: var(--muted); }
        .flex-center { display: flex; align-items: center; gap: 0.5rem; }
        .font-bold { font-weight: 700; }
        .text-xl { font-size: 1.25rem; }
        .text-sm { font-size: 0.875rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mt-4 { margin-top: 1rem; }
        .gap-2 { gap: 0.5rem; }
        .flex-wrap { flex-wrap: wrap; }
        .hidden { display: none; }
        .flex-1 { flex: 1; }
    </style>
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="brand">Course<span>Mate</span></div>
        <nav>
            <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
            <a href="students.html" class="active"><i class="fas fa-users"></i> Students</a>
            <a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
            <a href="attendance.html"><i class="fas fa-clipboard-list"></i> Attendance</a>
            <a href="analytics.html"><i class="fas fa-chart-bar"></i> Progress</a>
            <a href="announcements.html"><i class="fas fa-bullhorn"></i> Announcements</a>
            <a href="settings.html" id="settingsLink"><i class="fas fa-cog"></i> Settings</a>
            <a href="super-settings.html" id="superSettingsLink" style="display: none;">
                <i class="fas fa-crown"></i> Super Admin
            </a>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()">
            <i class="fas fa-moon"></i> Dark Mode
        </button>
        <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </aside>

    <!-- ===== MAIN ===== -->
    <div class="main-content">
        <div class="topbar">
            <div class="flex-center">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 class="text-xl font-bold" style="margin:0;">Students</h1>
            </div>
            <div class="flex-center">
                <!-- Notification Bell -->
                <div class="notif-wrapper">
                    <button class="bell-btn" id="notificationBell">
                        <i class="fas fa-bell"></i>
                    </button>
                    <span class="notif-badge" id="unreadBadge">0</span>
                    <div class="notif-dropdown" id="notificationDropdown">
                        <div id="notificationList"><div class="notif-empty">No notifications</div></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters & Export -->
        <div class="search-filters mb-4">
            <input type="text" id="searchInput" placeholder="Search students..." class="input-field flex-1" />
            <select id="filterStatus" class="filter-select">
                <option value="all">All Status</option>
                <option value="paid">Fully Paid</option>
                <option value="monthly_active">Monthly Active</option>
                <option value="expired">Expired</option>
                <option value="pending">Pending</option>
            </select>
            <button onclick="exportCSV()" class="btn-download">
                <i class="fas fa-download mr-1"></i> Export CSV
            </button>
        </div>

        <!-- Table -->
        <div class="table-card">
            <div class="table-title">
                <div class="title-left">
                    <i class="fas fa-list text-primary"></i> All Students
                </div>
                <div class="title-right">
                    <span class="text-sm text-muted" id="studentCount">0 students</span>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Status</th>
                            <th>Student ID</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <tr><td colspan="6" class="text-center text-gray-400 py-4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ===== STUDENT PROFILE MODAL ===== -->
    <div class="modal-overlay" id="studentModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2><i class="fas fa-user text-primary mr-2"></i> Student Profile</h2>
                <button class="close-btn" onclick="closeStudentModal()">&times;</button>
            </div>
            <div id="modalContent">
                <p class="text-center text-gray-400 py-4">Loading...</p>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    <script>
        // ============================================================
        // SIDEBAR TOGGLE
        // ============================================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) closeSidebar();
        });

        // ============================================================
        // DARK MODE
        // ============================================================
        function loadTheme() {
            const dark = localStorage.getItem('theme') === 'dark';
            document.body.classList.toggle('dark', dark);
            const icon = document.querySelector('.theme-toggle i');
            if (icon) icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const icon = document.querySelector('.theme-toggle i');
            if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }
        document.addEventListener('DOMContentLoaded', loadTheme);

        // ============================================================
        // LOGOUT
        // ============================================================
        window.handleLogout = async function() {
            try { await window.supabaseClient.auth.signOut(); window.location.href = '../login.html'; }
            catch (e) { window.location.href = '../login.html'; }
        };

        // ============================================================
        // SUPABASE CLIENT
        // ============================================================
        const supabaseClient = window.supabaseClient || (() => {
            const url = window.SUPABASE_URL || "https://mbniynyvcxzspjmzgovp.supabase.co";
            const key = window.SUPABASE_ANON_KEY || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibml5bnl2Y3h6c3BqbXpnb3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMTY5MTksImV4cCI6MjEwMDU5MjkxOX0.cp3F1zyJg0BAqPD0iLDbW2YHOD6JLZWtkthHINMX0RA";
            return window.supabase.createClient(url, key);
        })();
        window.supabaseClient = supabaseClient;

        // ============================================================
        // SHOW / HIDE SUPER ADMIN LINK
        // ============================================================
        async function updateSidebarForRole() {
            try {
                const user = await window.auth.getCurrentUser();
                if (!user) return;

                const { data, error } = await window.supabaseClient
                    .from('admins')
                    .select('role')
                    .eq('user_id', user.id)
                    .single();

                if (error) throw error;

                const isSuper = data?.role === 'super_admin';
                const superLink = document.getElementById('superSettingsLink');
                if (superLink) {
                    superLink.style.display = isSuper ? 'flex' : 'none';
                }
            } catch (err) {
                console.warn('Could not fetch role – hiding super admin link.', err);
                const superLink = document.getElementById('superSettingsLink');
                if (superLink) superLink.style.display = 'none';
            }
        }

        // ============================================================
        // NOTIFICATIONS
        // ============================================================
        async function fetchNotifications(userId) {
            try {
                const { data, error } = await supabaseClient
                    .from('notifications')
                    .select('*')
                    .eq('user_id', userId)
                    .order('created_at', { ascending: false });
                if (error) throw error;
                return data || [];
            } catch (e) { return []; }
        }

        function renderNotifications(notifications) {
            const list = document.getElementById('notificationList');
            const badge = document.getElementById('unreadBadge');
            const unread = notifications.filter(n => !n.is_read);

            badge.textContent = unread.length;
            badge.classList.toggle('show', unread.length > 0);

            if (!notifications.length) {
                list.innerHTML = '<div class="notif-empty">No notifications</div>';
                return;
            }

            list.innerHTML = notifications.map(n => `
                <div class="notif-item ${!n.is_read ? 'unread' : ''}">
                    <div class="title">${n.title}</div>
                    <div class="msg">${n.message}</div>
                    <div class="time">${new Date(n.created_at).toLocaleDateString()} ${new Date(n.created_at).toLocaleTimeString()}</div>
                    ${!n.is_read ? `<span class="mark-read" onclick="markAsRead('${n.id}')">Mark as read</span>` : ''}
                </div>
            `).join('');
        }

        async function markAsRead(id) {
            try {
                await supabaseClient.from('notifications').update({ is_read: true }).eq('id', id);
                await loadNotifications();
            } catch (e) {}
        }

        async function loadNotifications() {
            const user = await window.auth.getCurrentUser();
            if (!user) return;
            const data = await fetchNotifications(user.id);
            renderNotifications(data);
        }

        document.getElementById('notificationBell').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('notificationDropdown').classList.toggle('active');
        });
        document.addEventListener('click', () => {
            document.getElementById('notificationDropdown').classList.remove('active');
        });

        // ============================================================
        // STUDENT MODAL
        // ============================================================
        function closeStudentModal() {
            document.getElementById('studentModal').classList.remove('active');
        }
        document.getElementById('studentModal').addEventListener('click', function(e) {
            if (e.target === this) closeStudentModal();
        });

        async function viewStudent(studentId) {
            const modal = document.getElementById('studentModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('active');
            content.innerHTML = '<p class="text-center text-gray-400 py-4">Loading...</p>';

            try {
                const { data: student, error: studentError } = await supabaseClient
                    .from('students')
                    .select('*')
                    .eq('id', studentId)
                    .single();

                if (studentError) throw studentError;

                const { data: attendance, error: attError } = await supabaseClient
                    .from('attendance')
                    .select('session_date, check_in_time, status')
                    .eq('student_id', studentId)
                    .order('session_date', { ascending: false })
                    .limit(10);

                if (attError) throw attError;

                const statusMap = {
                    'paid': { label: 'Fully Paid', cls: 'badge-paid' },
                    'monthly_active': { label: 'Monthly Active', cls: 'badge-monthly' },
                    'expired': { label: 'Expired', cls: 'badge-expired' },
                    'pending': { label: 'Pending', cls: 'badge-pending' }
                };
                const statusInfo = statusMap[student.payment_status] || statusMap['pending'];

                let attendanceHtml = '';
                if (attendance && attendance.length > 0) {
                    attendanceHtml = attendance.map(a => `
                        <div class="attendance-item">
                            <span class="date">${a.session_date || '—'}</span>
                            <span>${a.check_in_time || '—'}</span>
                            <span class="status ${a.status}">${a.status ? a.status.toUpperCase() : '—'}</span>
                        </div>
                    `).join('');
                } else {
                    attendanceHtml = '<p class="text-sm text-gray-400">No attendance records found.</p>';
                }

                content.innerHTML = `
                    <div class="modal-row"><span class="label">Full Name</span><span class="value">${student.full_name || '—'}</span></div>
                    <div class="modal-row"><span class="label">Student ID</span><span class="value">${student.student_id || '—'}</span></div>
                    <div class="modal-row"><span class="label">Email</span><span class="value">${student.email || '—'}</span></div>
                    <div class="modal-row"><span class="label">Phone</span><span class="value">${student.phone || '—'}</span></div>
                    <div class="modal-row"><span class="label">Department</span><span class="value">${student.department || '—'}</span></div>
                    <div class="modal-row"><span class="label">Program</span><span class="value">${student.program || '—'}</span></div>
                    <div class="modal-row"><span class="label">Level</span><span class="value">${student.level || '—'}</span></div>
                    <div class="modal-row"><span class="label">Payment Status</span><span class="value"><span class="badge-status ${statusInfo.cls}">${statusInfo.label}</span></span></div>
                    <div class="modal-row"><span class="label">Joined</span><span class="value">${student.created_at ? new Date(student.created_at).toLocaleDateString() : '—'}</span></div>
                    <div class="modal-section-title"><i class="fas fa-clock mr-2"></i>Recent Attendance</div>
                    ${attendanceHtml}
                    <div class="mt-4">
                        <button onclick="closeStudentModal()" class="btn-secondary-sm">Close</button>
                    </div>
                `;

            } catch (err) {
                console.error('View student error:', err);
                content.innerHTML = '<p class="text-center text-red-500 py-4">Failed to load student details.</p>';
            }
        }

        // ============================================================
        // EXPORT CSV
        // ============================================================
        async function exportCSV() {
            try {
                const statusFilter = document.getElementById('filterStatus').value;
                let query = supabaseClient
                    .from('students')
                    .select('full_name, email, phone, department, program, level, student_id, payment_status, created_at');

                if (statusFilter !== 'all') {
                    query = query.eq('payment_status', statusFilter);
                }

                const { data: students, error } = await query;

                if (error) throw error;

                if (!students || students.length === 0) {
                    alert('No students to export.');
                    return;
                }

                const headers = ['Name', 'Email', 'Phone', 'Department', 'Program', 'Level', 'Student ID', 'Payment Status', 'Joined'];
                const rows = students.map(s => [
                    s.full_name || '',
                    s.email || '',
                    s.phone || '',
                    s.department || '',
                    s.program || '',
                    s.level || '',
                    s.student_id || '',
                    s.payment_status || '',
                    s.created_at ? new Date(s.created_at).toLocaleDateString() : ''
                ]);

                const csvContent = [headers.join(','), ...rows.map(row => row.join(','))].join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `students_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
                URL.revokeObjectURL(url);

            } catch (err) {
                console.error('Export error:', err);
                alert('Failed to export CSV.');
            }
        }

        // ============================================================
        // LOAD STUDENTS
        // ============================================================
        let studentsCache = [];

        async function loadStudents() {
            try {
                const search = document.getElementById('searchInput').value.toLowerCase();
                const statusFilter = document.getElementById('filterStatus').value;

                let query = supabaseClient
                    .from('students')
                    .select('id, full_name, email, department, payment_status, student_id')
                    .order('full_name');

                if (statusFilter !== 'all') {
                    query = query.eq('payment_status', statusFilter);
                }

                const { data: students, error } = await query;

                if (error) throw error;

                studentsCache = students || [];
                renderStudents(studentsCache, search);

            } catch (err) {
                console.error('Load students error:', err);
                document.getElementById('studentTableBody').innerHTML = `<tr><td colspan="6" class="text-center text-red-500 py-4">Failed to load students.</td></tr>`;
            }
        }

        function renderStudents(students, search) {
            const tbody = document.getElementById('studentTableBody');
            const countEl = document.getElementById('studentCount');

            if (!students || students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-gray-400 py-4">No students found.</td></tr>`;
                countEl.textContent = '0 students';
                return;
            }

            const statusMap = {
                'paid': { label: 'Fully Paid', cls: 'badge-paid' },
                'monthly_active': { label: 'Monthly Active', cls: 'badge-monthly' },
                'expired': { label: 'Expired', cls: 'badge-expired' },
                'pending': { label: 'Pending', cls: 'badge-pending' }
            };

            const filtered = search
                ? students.filter(s =>
                    (s.full_name?.toLowerCase().includes(search) ||
                    s.email?.toLowerCase().includes(search) ||
                    s.student_id?.toLowerCase().includes(search))
                )
                : students;

            countEl.textContent = `${filtered.length} students`;

            tbody.innerHTML = filtered.map(s => {
                const info = statusMap[s.payment_status] || statusMap['pending'];
                return `
                    <tr>
                        <td data-label="Name" class="py-2 font-medium">${s.full_name || '—'}</td>
                        <td data-label="Department" class="py-2">${s.department || '—'}</td>
                        <td data-label="Status" class="py-2"><span class="badge-status ${info.cls}">${info.label}</span></td>
                        <td data-label="Student ID" class="py-2">${s.student_id || '—'}</td>
                        <td data-label="Action" class="py-2">
                            <button onclick="viewStudent('${s.id}')" class="btn-primary-sm"><i class="fas fa-eye mr-1"></i> View</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ============================================================
        // FILTER & SEARCH EVENTS
        // ============================================================
        document.getElementById('searchInput').addEventListener('input', loadStudents);
        document.getElementById('filterStatus').addEventListener('change', loadStudents);

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', async function() {
            await updateSidebarForRole();
            await loadNotifications();
            await loadStudents();
        });
    </script>
</body>
</html>
