<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - CourseMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body { background: #f9fafb; font-family: 'Inter', system-ui, sans-serif; }
        .card { background: white; border-radius: 16px; padding: 2rem; max-width: 420px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; }
        .btn-primary { background: #008751; color: white; }
        .btn-primary:hover { background: #006d3f; }

        /* ===== BRAND MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 1rem;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            padding: 2rem 1.5rem 1.5rem;
            box-shadow: 0 24px 60px rgba(0,0,0,0.25);
            animation: fadeIn 0.25s ease;
            text-align: center;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-icon { font-size: 3rem; margin-bottom: 0.5rem; }
        .modal-icon.success { color: #22c55e; }
        .modal-icon.error { color: #ef4444; }
        .modal-title { font-size: 1.25rem; font-weight: 700; color: #1a202c; }
        .modal-message { color: #4a5568; font-size: 0.95rem; margin: 0.25rem 0 1.25rem; }
        .modal-btn {
            padding: 0.4rem 1.5rem;
            border: none;
            border-radius: 8px;
            background: #008751;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }
        .modal-btn:hover { background: #006d3f; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="card">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Reset Password</h2>
            <p class="text-gray-600 mt-1">We'll send you a link to reset your password.</p>
        </div>

        <form id="resetForm">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="resetEmail" placeholder="you@example.com" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none" required />
            </div>
            <button type="submit" class="w-full py-3 btn-primary rounded-lg font-semibold">
                <i class="fas fa-paper-plane mr-2"></i>Send Reset Link
            </button>
        </form>

        <div class="text-center mt-6 text-sm text-gray-600">
            Remember your password? <a href="login.html" class="text-primary-500 font-semibold hover:underline">Login</a>
        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div class="modal-icon" id="modal-icon"><i class="fas fa-check-circle"></i></div>
            <div class="modal-title" id="modal-title">Success</div>
            <div class="modal-message" id="modal-message">Your action was completed.</div>
            <button class="modal-btn" id="modal-btn">OK</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================
        // SUPABASE CLIENT
        // ============================================
        const SUPABASE_URL = "https://mbniynyvcxzspjmzgovp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibml5bnl2Y3h6c3BqbXpnb3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMTY5MTksImV4cCI6MjEwMDU5MjkxOX0.cp3F1zyJg0BAqPD0iLDbW2YHOD6JLZWtkthHINMX0RA";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================
        // MODAL
        // ============================================
        const modal = document.getElementById('modal');
        const modalIcon = document.getElementById('modal-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalBtn = document.getElementById('modal-btn');

        function showModal(icon, title, message, type = 'success') {
            modalIcon.innerHTML = `<i class="fas ${icon}"></i>`;
            modalIcon.className = 'modal-icon ' + type;
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modal.classList.add('active');
            // Auto‑close after 4 seconds
            setTimeout(() => modal.classList.remove('active'), 4000);
        }
        modalBtn.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        // ============================================
        // FORM
        // ============================================
        const form = document.getElementById('resetForm');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value.trim();
            if (!email) {
                showModal('fa-exclamation-triangle', 'Missing Email', 'Please enter your email address.', 'error');
                return;
            }

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: 'https://coursemate-tutorial.vercel.app/reset-password.html',
                });
                if (error) throw error;

                showModal('fa-check-circle', '✅ Email Sent', 'Password reset link sent! Check your inbox.', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            } catch (err) {
                showModal('fa-exclamation-circle', '❌ Error', 'Failed to send reset link: ' + err.message, 'error');
                console.error(err);
            }
        });
    </script>
</body>
</html>
