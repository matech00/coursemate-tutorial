<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete Your Profile - CourseMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#E8F5E9', 100: '#C8E6C9', 200: '#A5D6A7',
                            300: '#81C784', 400: '#66BB6A', 500: '#008751',
                            600: '#007A48', 700: '#006D3F', 800: '#005B34', 900: '#004A2A'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body>

    <nav class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-200 h-16 flex items-center px-4 md:px-8 shadow-sm">
        <div class="max-w-7xl w-full mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-primary-500">
                Course<span class="font-light text-gray-600">Mate</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="login.html" class="text-sm text-gray-600 hover:text-primary-500 transition font-medium">Login</a>
                <a href="index.html" class="text-sm text-gray-600 hover:text-primary-500 transition font-medium"><i class="fas fa-home"></i> Home</a>
            </div>
        </div>
    </nav>

    <div class="bg-gradient-to-b from-primary-50 to-white min-h-screen flex items-center justify-center px-4 pt-20 pb-10">
        <div class="bg-white max-w-md w-full rounded-2xl shadow-xl p-6 sm:p-8 border border-gray-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-primary-100 rounded-full flex items-center justify-center mx-auto mb-4 text-primary-500 text-2xl">
                    <i class="fas fa-user-edit"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Complete Your Profile</h2>
                <p class="text-gray-600 mt-1 text-sm">Tell us a bit more about you to continue with tutorial enrollment.</p>
            </div>

            <form id="profileForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number <span class="text-red-500">*</span></label>
                    <input type="tel" id="phone" placeholder="080 123 4567" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-shadow" required />
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Department <span class="text-red-500">*</span></label>
                    <select id="department" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-shadow bg-white" required>
                        <option value="">Select Department</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Program <span class="text-red-500">*</span></label>
                    <select id="program" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-shadow bg-white" required>
                        <option value="">Select Program</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Level <span class="text-red-500">*</span></label>
                    <select id="level" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-shadow bg-white" required>
                        <option value="">Select Level</option>
                        <option value="100L">100 Level</option>
                        <option value="200L">200 Level</option>
                        <option value="300L">300 Level</option>
                        <option value="400L">400 Level</option>
                        <option value="500L">500 Level</option>
                    </select>
                </div>

                <button type="submit" id="saveBtn" class="w-full py-3 bg-primary-500 text-white rounded-lg hover:bg-primary-600 font-semibold transition-all shadow-sm hover:shadow-md flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i> Save & Continue
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>

    <script>
        const supabaseClient = window.supabaseClient;

        // ============================================================
        // GET SOURCE
        // ============================================================
        function getSource() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('source') || 'tutorial';
        }

        // ============================================================
        // CHECK USER - ALLOW LOGBOOK BUYERS TO ENROLL
        // ============================================================
        async function checkUserType(user) {
            const { data: student } = await supabaseClient
                .from('students')
                .select('is_tutorial_student, phone, department, program, level')
                .eq('user_id', user.id)
                .maybeSingle();

            const source = getSource();

            // Logbook buyers CAN enroll in tutorial (source = tutorial)
            // Only redirect if they're a logbook buyer AND NOT coming from tutorial enrollment
            if (student && student.is_tutorial_student === false && source !== 'tutorial') {
                window.location.href = 'student/logbook/shop.html';
                return false;
            }

            // If user is already a tutorial student, redirect to dashboard or payment
            if (student && student.is_tutorial_student === true) {
                // Check if profile is complete
                if (!student.phone || !student.department || !student.program || !student.level) {
                    return true; // Stay on this page
                }
                // Profile complete, go to payment
                window.location.href = 'payment.html';
                return false;
            }

            return true;
        }

        // ============================================================
        // LOAD DROPDOWNS
        // ============================================================
        async function loadDropdowns() {
            try {
                const { data: departments, error: deptError } = await supabaseClient
                    .from('departments')
                    .select('id, name')
                    .order('name');
                if (deptError) throw deptError;

                const deptSelect = document.getElementById('department');
                deptSelect.innerHTML = '<option value="">Select Department</option>';
                departments.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.name;
                    deptSelect.appendChild(opt);
                });

                const progSelect = document.getElementById('program');
                document.getElementById('department').addEventListener('change', async function() {
                    const deptId = this.value;
                    progSelect.innerHTML = '<option value="">Select Program</option>';
                    if (!deptId) return;
                    const { data: programs, error: progError } = await supabaseClient
                        .from('programs')
                        .select('id, name')
                        .eq('department_id', deptId)
                        .order('name');
                    if (progError) throw progError;
                    programs.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = p.name;
                        progSelect.appendChild(opt);
                    });
                });
            } catch (err) {
                console.error('Load error:', err);
                alert('Could not load departments. Please refresh.');
            }
        }

        // ============================================================
        // PRE-FILL EXISTING DATA
        // ============================================================
        async function preFillData(user) {
            try {
                const { data: student } = await supabaseClient
                    .from('students')
                    .select('phone, department, program, level')
                    .eq('user_id', user.id)
                    .maybeSingle();

                if (student) {
                    if (student.phone) document.getElementById('phone').value = student.phone;
                    // Note: Department, program, level are dropdowns
                    // We'll need to match the text, which is more complex
                    // For now, only pre-fill phone
                }
            } catch (err) {
                console.error('Pre-fill error:', err);
            }
        }

        // ============================================================
        // SAVE PROFILE
        // ============================================================
        document.getElementById('profileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            try {
                const user = await window.auth.getCurrentUser();
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }

                const phone = document.getElementById('phone').value.trim();
                const department = document.getElementById('department').options[document.getElementById('department').selectedIndex].text;
                const program = document.getElementById('program').options[document.getElementById('program').selectedIndex].text;
                const level = document.getElementById('level').value;

                if (!phone || !department || !program || !level) {
                    alert('Please fill in all fields.');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-save"></i> Save & Continue';
                    return;
                }

                // Check if student already exists
                const { data: existingStudent } = await supabaseClient
                    .from('students')
                    .select('id')
                    .eq('user_id', user.id)
                    .maybeSingle();

                let result;

                if (existingStudent) {
                    // Update existing record - set is_tutorial_student to true
                    result = await supabaseClient
                        .from('students')
                        .update({
                            phone: phone,
                            department: department,
                            program: program,
                            level: level,
                            is_tutorial_student: true,
                            payment_status: 'pending'
                        })
                        .eq('user_id', user.id);
                } else {
                    // Insert new record
                    result = await supabaseClient
                        .from('students')
                        .insert({
                            user_id: user.id,
                            full_name: user.user_metadata?.full_name || user.email?.split('@')[0] || 'Student',
                            email: user.email,
                            phone: phone,
                            department: department,
                            program: program,
                            level: level,
                            payment_status: 'pending',
                            is_tutorial_student: true
                        });
                }

                if (result.error) throw result.error;

                // Redirect to payment
                window.location.href = 'payment.html';

            } catch (err) {
                console.error('Save error:', err);
                alert('Failed to save profile: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Save & Continue';
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', async function() {
            const user = await window.auth.getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const isValid = await checkUserType(user);
            if (isValid) {
                await loadDropdowns();
                await preFillData(user);
            }
        });
    </script>
</body>
</html>
