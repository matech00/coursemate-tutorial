<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Attendance - CourseMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Add this after the CSS links -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Same theme as profile – copy the exact <style> block from profile.html */
        :root {
            --bg: #f9fafb;
            --card: #ffffff;
            --text: #111827;
            --border: #e5e7eb;
            --muted: #6b7280;
            --shadow: 0 2px 8px rgba(0,0,0,0.02);
            --hover-bg: #f3f4f6;
            --primary: #008751;
            --primary-light: #E8F5E9;
            --primary-dark: #006d3f;
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
            --muted: #94a3b8;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --hover-bg: #2d3748;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        /* ===== SIDEBAR (same as profile) ===== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100%;
            background: var(--card);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease, background 0.3s, border 0.3s;
        }
        .sidebar .brand { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 2rem; }
        .sidebar .brand span { font-weight: 300; color: var(--text); }
        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            color: var(--text);
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
            font-size: 0.95rem;
        }
        .sidebar nav a:hover { background: var(--primary-light); color: var(--primary); }
        .sidebar nav a.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .sidebar nav a i { width: 1.25rem; text-align: center; }
        .sidebar .logout-btn, .sidebar .theme-toggle {
            margin-top: 0.5rem;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text);
            transition: background 0.2s;
        }
        .sidebar .logout-btn:hover { background: #fee2e2; color: #dc2626; }
        .sidebar .theme-toggle:hover { background: var(--hover-bg); }
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 99;
            display: none;
        }
        .sidebar-overlay.active { display: block; }
        /* ===== MAIN ===== */
        .main-content {
            margin-left: 260px;
            padding: 1.5rem 2rem;
            min-height: 100vh;
            transition: background 0.3s;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--primary-light);
        }
        .topbar .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text);
            cursor: pointer;
            padding: 0.25rem 0.5rem;
        }
        /* ===== ATTENDANCE ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        @media (max-width: 640px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        .stat-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1rem;
            text-align: center;
            box-shadow: var(--shadow);
            transition: background 0.3s, border 0.3s;
        }
        .stat-box .number { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        .stat-box .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
        .stat-box .number.present { color: #22c55e; }
        .stat-box .number.late { color: #eab308; }
        .stat-box .number.absent { color: #ef4444; }
        .card-table {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: background 0.3s, border 0.3s;
        }
        .card-table h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card-table h3 i { color: var(--primary); }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 0.6rem 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .status-badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge-present { background: #d1fae5; color: #065f46; }
        .badge-late { background: #fef3c7; color: #92400e; }
        .badge-absent { background: #fee2e2; color: #991b1b; }
        .text-muted { color: var(--muted); }
        .text-center { text-align: center; }
        .loader {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .mt-2 { margin-top: 0.5rem; }
        .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .text-red-500 { color: #ef4444; }
        .hidden { display: none; }
        .flex-center { display: flex; align-items: center; gap: 0.5rem; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 75%; max-width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 1rem; }
            .topbar .menu-toggle { display: block; }
        }
        @media (min-width: 769px) { .sidebar-overlay { display: none !important; } }
        .text-primary { color: var(--primary); }
        .text-xl { font-size: 1.25rem; }
        .font-bold { font-weight: 700; }
     


    </style>
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="brand">Course<span>Mate</span></div>
        <nav>
            <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
            <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
            <a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
            <a href="attendance.html" class="active"><i class="fas fa-clipboard-list"></i> Attendance</a>
            <a href="qr.html"><i class="fas fa-qrcode"></i> My QR Code</a>
            <a href="id-card.html"><i class="fas fa-id-card"></i> ID Card</a>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()">
            <i class="fas fa-moon"></i> Dark Mode
        </button>
        <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </aside>

    <!-- ===== MAIN ===== -->
    <div class="main-content">
        <div class="topbar">
            <div class="flex-center">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 class="text-xl font-bold" style="margin:0;">My Attendance</h1>
            </div>
            <a href="dashboard.html" class="text-sm text-muted" style="text-decoration:none;"><i class="fas fa-arrow-left"></i> Dashboard</a>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="stats-container">
            <div class="stat-box"><div class="number" id="stat-total">0</div><div class="label">Total Sessions</div></div>
            <div class="stat-box"><div class="number present" id="stat-present">0</div><div class="label">Present</div></div>
            <div class="stat-box"><div class="number late" id="stat-late">0</div><div class="label">Late</div></div>
            <div class="stat-box"><div class="number absent" id="stat-absent">0</div><div class="label">Absent</div></div>
        </div>

        <!-- Table -->
        <div class="card-table">
            <h3><i class="fas fa-list-ul"></i> Attendance Log</h3>
            <div id="loading-state" class="text-center py-6">
                <div class="loader"></div>
                <p class="text-muted mt-2">Loading your records...</p>
            </div>
            <div id="table-container" style="display:none;">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Date</th><th>Check‑in Time</th><th>Status</th></tr></thead>
                        <tbody id="attendance-body"></tbody>
                    </table>
                </div>
                <div id="empty-message" class="text-center text-muted py-4" style="display:none;">
                    <i class="fas fa-calendar-day" style="font-size:1.5rem; color:var(--muted);"></i>
                    <p>No attendance records yet.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        // ===== SIDEBAR, DARK MODE, LOGOUT =====
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) closeSidebar();
        });

        function loadTheme() {
            const dark = localStorage.getItem('theme') === 'dark';
            document.body.classList.toggle('dark', dark);
            const icon = document.querySelector('.theme-toggle i');
            if (icon) icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const icon = document.querySelector('.theme-toggle i');
            if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }
        document.addEventListener('DOMContentLoaded', loadTheme);

        window.handleLogout = async function() {
            try { await window.supabaseClient.auth.signOut(); window.location.href = '../login.html'; } catch (e) { window.location.href = '../login.html'; }
        };

        const supabaseClient = window.supabaseClient || (() => {
            const url = window.SUPABASE_URL || "https://mbniynyvcxzspjmzgovp.supabase.co";
            const key = window.SUPABASE_ANON_KEY || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibml5bnl2Y3h6c3BqbXpnb3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMTY5MTksImV4cCI6MjEwMDU5MjkxOX0.cp3FzyJg0BAqPD0iLDbW2YHOD6JLZWtkthHINMX0RA";
            return window.supabase.createClient(url, key);
        })();

        // ===== LOAD ATTENDANCE =====
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const user = await window.auth.getCurrentUser();
                if (!user) { window.location.href = '../login.html'; return; }

                const { data: student, error: stuErr } = await supabaseClient
                    .from('students')
                    .select('id')
                    .eq('user_id', user.id)
                    .single();

                if (stuErr || !student) {
                    document.getElementById('loading-state').innerHTML = '<p class="text-red-500">Student profile not found.</p>';
                    return;
                }

                const { data: records, error } = await supabaseClient
                    .from('attendance')
                    .select('session_date, check_in_time, status')
                    .eq('student_id', student.id)
                    .order('session_date', { ascending: false })
                    .order('check_in_time', { ascending: false });

                if (error) throw error;

                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('table-container').style.display = 'block';

                if (!records || records.length === 0) {
                    document.getElementById('empty-message').style.display = 'block';
                    return;
                }

                const total = records.length;
                const present = records.filter(r => r.status === 'present').length;
                const late = records.filter(r => r.status === 'late').length;
                const absent = records.filter(r => r.status === 'absent').length;

                document.getElementById('stat-total').textContent = total;
                document.getElementById('stat-present').textContent = present;
                document.getElementById('stat-late').textContent = late;
                document.getElementById('stat-absent').textContent = absent;

                const statusMap = {
                    'present': { label: 'Present', cls: 'badge-present' },
                    'late': { label: 'Late', cls: 'badge-late' },
                    'absent': { label: 'Absent', cls: 'badge-absent' }
                };

                const rows = records.map(rec => {
                    const info = statusMap[rec.status] || { label: rec.status, cls: 'badge-absent' };
                    const date = rec.session_date ? new Date(rec.session_date).toLocaleDateString('en-NG', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
                    const time = rec.check_in_time || '—';
                    return `<tr>
                        <td>${date}</td>
                        <td>${time}</td>
                        <td><span class="status-badge ${info.cls}">${info.label}</span></td>
                    </tr>`;
                }).join('');

                document.getElementById('attendance-body').innerHTML = rows;

            } catch (err) {
                console.error(err);
                document.getElementById('loading-state').innerHTML = '<p class="text-red-500">Failed to load attendance records.</p>';
            }
        });
    </script>
</body>
</html>
