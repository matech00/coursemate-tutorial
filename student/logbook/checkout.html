<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Buy Logbook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="../../assets/images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #f9fafb; --card: #ffffff; --text: #111827;
            --border: #e5e7eb; --muted: #6b7280; --shadow: 0 2px 8px rgba(0,0,0,0.02);
            --hover-bg: #f3f4f6; --primary: #008751; --primary-light: #E8F5E9; --primary-dark: #006d3f;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; min-height: 100vh; }
        .navbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .navbar .brand { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; }
        .navbar .brand span { font-weight: 300; color: var(--text); }
        .navbar .nav-links { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
        .navbar a { color: var(--text); text-decoration: none; font-size: 0.9rem; font-weight: 500; display: inline-flex; align-items: center; gap: 0.4rem; }
        .navbar a:hover { color: var(--primary); }
        .container { max-width: 640px; margin: 0 auto; padding: 2rem 1.5rem; }
        .checkout-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: var(--shadow); }
        .checkout-card .title { font-size: 1.25rem; font-weight: 700; color: var(--text); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .checkout-card .summary { background: var(--primary-light); padding: 1rem; border-radius: 10px; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .checkout-card .summary .label { color: var(--muted); font-size: 0.85rem; }
        .checkout-card .summary .value { font-weight: 700; color: var(--primary); font-size: 1.1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text); margin-bottom: 0.25rem; }
        .form-group input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 0.95rem; transition: border 0.2s; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,135,81,0.15); }
        .form-group small { color: var(--muted); font-size: 0.75rem; display: block; margin-top: 0.25rem; }
        .btn { width: 100%; padding: 0.75rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .loader { display: inline-block; width: 20px; height: 20px; border: 3px solid #e5e7eb; border-radius: 50%; border-top-color: #008751; animation: spin 0.8s linear infinite; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .text-muted { color: var(--muted); }
        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; max-width: 380px; width: 100%; }
        .toast { background: var(--card); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 0.75rem; box-shadow: 0 8px 30px rgba(0,0,0,0.12); border-left: 4px solid var(--primary); display: flex; align-items: center; gap: 0.75rem; animation: slideIn 0.3s ease; font-size: 0.9rem; }
        .toast.error { border-left-color: #dc2626; }
        .toast.warning { border-left-color: #f59e0b; }
        .toast.success { border-left-color: #22c55e; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast .toast-close { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 1rem; margin-left: auto; }
        @media (max-width: 640px) {
            .navbar { padding: 0.75rem 1rem; flex-direction: column; align-items: flex-start; }
            .container { padding: 1rem; }
            .checkout-card { padding: 1.25rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="../../index.html" class="brand">Course<span>Mate</span></a>
        <div class="nav-links" id="navLinks"></div>
    </nav>

    <div id="toastContainer" class="toast-container"></div>

    <div class="container">
        <div class="checkout-card">
            <div class="title"><i class="fas fa-credit-card" style="color: var(--primary);"></i> Checkout</div>

            <div id="orderSummary" class="summary">
                <div>
                    <div class="label">Logbook</div>
                    <div class="value" id="logbookDisplay">Loading...</div>
                </div>
                <div>
                    <div class="label">Amount</div>
                    <div class="value" id="amountDisplay">&#8358;0</div>
                </div>
            </div>

            <form id="checkoutForm">
                <div class="form-group">
                    <label for="studentName">Full Name <span style="color: #dc2626;">*</span></label>
                    <input type="text" id="studentName" placeholder="Enter your full name" required />
                </div>
                <div class="form-group">
                    <label for="matricNumber">Matric Number <span style="color: #dc2626;">*</span></label>
                    <input type="text" id="matricNumber" placeholder="e.g., NOU20251234" required />
                    <small>Must be 9-12 alphanumeric characters.</small>
                </div>
                <div class="form-group">
                    <label for="email">Email Address <span style="color: #dc2626;">*</span></label>
                    <input type="email" id="email" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number <span style="color: #dc2626;">*</span></label>
                    <input type="tel" id="phone" placeholder="080 123 4567" required />
                </div>
                <div class="form-group">
                    <label for="programme">Programme (Degree) <span style="color: #dc2626;">*</span></label>
                    <input type="text" id="programme" placeholder="e.g., Information Technology" required />
                </div>
                <div class="form-group">
                    <label for="level">Level <span style="color: #dc2626;">*</span></label>
                    <input type="text" id="level" placeholder="e.g., 100" required />
                </div>
                <div class="form-group">
                    <label for="group">Group <span style="color: #dc2626;">*</span></label>
                    <input type="text" id="group" placeholder="e.g., Group A" required />
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" placeholder="e.g., Computer Science" />
                </div>
                <div class="form-group">
                    <label for="studyCentre">Study Centre</label>
                    <input type="text" id="studyCentre" placeholder="e.g., Lagos Study Centre" />
                </div>

                <button type="submit" id="payBtn" class="btn btn-primary">
                    <i class="fas fa-credit-card"></i> Pay Now
                </button>
            </form>

            <div id="paymentStatus" class="text-center hidden mt-4">
                <div class="loader"></div>
                <p class="text-muted mt-2">Processing payment...</p>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        var supabaseUrl = "https://mbniynyvcxzspjmzgovp.supabase.co";
        var supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibml5bnl2Y3h6c3BqbXpnb3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMTY5MTksImV4cCI6MjEwMDU5MjkxOX0.cp3F1zyJg0BAqPD0iLDbW2YHOD6JLZWtkthHINMX0RA";
        var supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        var PAYSTACK_KEY = 'pk_test_bab718f93005134c2437a6f9fe83f3f8db6d966a';

        // ============================================================
        // SMART NAVBAR
        // ============================================================
        (function() {
            var navLinks = document.getElementById('navLinks');
            var studentEmail = localStorage.getItem('studentEmail');
            var adminEmail = localStorage.getItem('adminEmail');
            var html = '';

            if (adminEmail) {
                html += '<a href="/admin/dashboard.html"><i class="fas fa-tachometer-alt"></i> Admin</a>';
                html += '<a href="shop.html"><i class="fas fa-book"></i> Shop</a>';
            } else if (studentEmail) {
                html += '<a href="../../student/dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>';
                html += '<a href="shop.html"><i class="fas fa-book"></i> Shop</a>';
                html += '<a href="my-orders.html"><i class="fas fa-list"></i> My Orders</a>';
            } else {
                html += '<a href="../../index.html"><i class="fas fa-home"></i> Home</a>';
                html += '<a href="shop.html"><i class="fas fa-book"></i> Shop</a>';
                html += '<a href="my-orders.html"><i class="fas fa-list"></i> My Orders</a>';
                html += '<a href="../../login.html"><i class="fas fa-sign-in-alt"></i> Login</a>';
            }
            navLinks.innerHTML = html;
        })();

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type) {
            type = type || 'info';
            var container = document.getElementById('toastContainer');
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            var icons = { success: 'fas fa-check-circle', error: 'fas fa-exclamation-circle', warning: 'fas fa-exclamation-triangle', info: 'fas fa-info-circle' };
            var iconClass = icons[type] || icons.info;
            toast.innerHTML = '<i class="' + iconClass + '" style="color: var(--primary);"></i><span style="flex:1;">' + message + '</span><button class="toast-close" onclick="this.parentElement.remove()">&times;</button>';
            container.appendChild(toast);
            setTimeout(function() { if (toast.parentElement) toast.remove(); }, 5000);
        }

        // ============================================================
        // LOAD SELECTED LOGBOOK
        // ============================================================
        function loadSelectedLogbook() {
            try {
                var data = sessionStorage.getItem('selectedLogbook');
                if (!data) {
                    showToast('No logbook selected. Redirecting to shop...', 'warning');
                    setTimeout(function() { window.location.href = 'shop.html'; }, 2000);
                    return null;
                }
                var book = JSON.parse(data);
                document.getElementById('logbookDisplay').textContent = book.code + ' - ' + book.name;
                document.getElementById('amountDisplay').textContent = '₦' + book.price.toLocaleString();

                // Pre-fill email from localStorage if user logged in
                var savedEmail = localStorage.getItem('studentEmail');
                var savedName = localStorage.getItem('studentName');
                if (savedEmail) document.getElementById('email').value = savedEmail;
                if (savedName) document.getElementById('studentName').value = savedName;

                return book;
            } catch (error) {
                console.error('Error loading logbook:', error);
                window.location.href = 'shop.html';
                return null;
            }
        }

        // ============================================================
        // GENERATE ORDER NUMBER
        // ============================================================
        function generateOrderNumber() {
            var date = new Date();
            var year = date.getFullYear();
            var month = String(date.getMonth() + 1).padStart(2, '0');
            var day = String(date.getDate()).padStart(2, '0');
            var random = String(Math.floor(1000 + Math.random() * 9000));
            return 'CMT-' + year + month + day + '-' + random;
        }

        // ============================================================
        // SUBMIT ORDER
        // ============================================================
        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var book = loadSelectedLogbook();
            if (!book) return;

            var studentName = document.getElementById('studentName').value.trim();
            var matricNumber = document.getElementById('matricNumber').value.trim();
            var email = document.getElementById('email').value.trim();
            var phone = document.getElementById('phone').value.trim();
            var department = document.getElementById('department').value.trim();
            var studyCentre = document.getElementById('studyCentre').value.trim();
            var programme = document.getElementById('programme').value.trim();
            var level = document.getElementById('level').value.trim();
            var group = document.getElementById('group').value.trim();

            if (!studentName || !matricNumber || !email || !phone || !programme || !level || !group) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            var matricRegex = /^[a-zA-Z0-9]{9,12}$/;
            if (!matricRegex.test(matricNumber)) {
                showToast('Invalid Matric Number. Must be 9-12 letters/numbers.', 'error');
                return;
            }

            var payBtn = document.getElementById('payBtn');
            var statusDiv = document.getElementById('paymentStatus');

            payBtn.disabled = true;
            payBtn.innerHTML = '<div class="loader"></div> Processing...';
            statusDiv.classList.remove('hidden');

            var orderNumber = generateOrderNumber();
            var deliveryDate = new Date();
            deliveryDate.setHours(deliveryDate.getHours() + 48);

            supabaseClient
                .from('logbook_orders')
                .insert([{
                    order_number: orderNumber,
                    student_name: studentName,
                    matric_number: matricNumber,
                    email: email,
                    phone: phone,
                    department: department,
                    study_centre: studyCentre,
                    programme: programme,
                    level: level,
                    student_group: group,
                    logbook_code: book.code,
                    logbook_name: book.name,
                    amount: book.price,
                    order_date: new Date().toISOString(),
                    delivery_date: deliveryDate.toISOString(),
                    status: 'pending'
                }])
                .select()
                .single()
                .then(function(result) {
                    if (result.error) {
                        throw result.error;
                    }

                    var reference = 'LOG-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

                    var handler = PaystackPop.setup({
                        key: PAYSTACK_KEY,
                        email: email,
                        amount: book.price * 100,
                        currency: 'NGN',
                        ref: reference,
                        metadata: {
                            custom_fields: [
                                { display_name: "Order Number", variable_name: "order_number", value: orderNumber },
                                { display_name: "Logbook", variable_name: "logbook", value: book.code },
                                { display_name: "Student Name", variable_name: "student_name", value: studentName },
                                { display_name: "Matric Number", variable_name: "matric_number", value: matricNumber }
                            ]
                        },
                        callback: function(response) {
                            console.log('Payment successful:', response);

                            supabaseClient
                                .from('logbook_orders')
                                .update({
                                    payment_reference: response.reference,
                                    status: 'accepted'
                                })
                                .eq('order_number', orderNumber)
                                .then(function() {
                                    // ✅ Save FULL order info for confirmation page + history
                                    sessionStorage.setItem('lastOrder', JSON.stringify({
                                        orderNumber: orderNumber,
                                        studentName: studentName,
                                        email: email,
                                        logbook: book.code,
                                        logbookName: book.name,
                                        amount: book.price,
                                        orderDate: new Date().toLocaleDateString(),
                                        deliveryDate: deliveryDate.toLocaleDateString()
                                    }));

                                    // ✅ Persist email + name so my-orders.html and confirmation.html can find them
                                    localStorage.setItem('studentEmail', email);
                                    localStorage.setItem('studentName', studentName);

                                    sessionStorage.setItem('orderMessage', 'Order #' + orderNumber + ' placed successfully!');
                                    window.location.href = 'confirmation.html';
                                })
                                .catch(function(err) {
                                    console.error('Update error:', err);
                                    // Still save & redirect even if update failed (payment went through)
                                    sessionStorage.setItem('lastOrder', JSON.stringify({
                                        orderNumber: orderNumber,
                                        studentName: studentName,
                                        email: email,
                                        logbook: book.code,
                                        logbookName: book.name,
                                        amount: book.price,
                                        orderDate: new Date().toLocaleDateString()
                                    }));
                                    localStorage.setItem('studentEmail', email);
                                    localStorage.setItem('studentName', studentName);
                                    window.location.href = 'confirmation.html';
                                });
                        },
                        onClose: function() {
                            showToast('Payment cancelled. You can try again.', 'warning');
                            payBtn.disabled = false;
                            payBtn.innerHTML = '<i class="fas fa-credit-card"></i> Pay Now';
                            statusDiv.classList.add('hidden');
                        }
                    });

                    handler.openIframe();

                })
                .catch(function(error) {
                    console.error('Order error:', error);
                    showToast('Failed to place order: ' + (error.message || error.error_description || 'Unknown error'), 'error');
                    payBtn.disabled = false;
                    payBtn.innerHTML = '<i class="fas fa-credit-card"></i> Pay Now';
                    statusDiv.classList.add('hidden');
                });
        });

        document.addEventListener('DOMContentLoaded', function() {
            loadSelectedLogbook();
        });
    </script>
</body>
</html>
