<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Buy Logbook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="../../assets/images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #f9fafb; --card: #ffffff; --text: #111827;
            --border: #e5e7eb; --muted: #6b7280;
            --primary: #008751; --primary-light: #E8F5E9; --primary-dark: #006d3f;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; min-height: 100vh; }
        .navbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .navbar .brand { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; }
        .navbar .brand span { font-weight: 300; color: var(--text); }
        .navbar .nav-links { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
        .navbar a { color: var(--text); text-decoration: none; font-size: 0.9rem; font-weight: 500; display: inline-flex; align-items: center; gap: 0.4rem; position: relative; }
        .navbar a:hover { color: var(--primary); }
        .cart-badge { position: absolute; top: -8px; right: -10px; background: #dc2626; color: white; font-size: 0.65rem; font-weight: 700; min-width: 18px; height: 18px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
        .cart-badge.hidden-badge { display: none; }

        .container { max-width: 640px; margin: 0 auto; padding: 2rem 1.5rem; }
        .checkout-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; }
        .checkout-card .title { font-size: 1.25rem; font-weight: 700; color: var(--text); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }

        .items-list {
            background: var(--bg);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        .items-list .items-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }
        .checkout-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .checkout-item:last-child { border-bottom: none; padding-bottom: 0; }
        .checkout-item .info { display: flex; flex-direction: column; }
        .checkout-item .info .code { font-weight: 700; color: var(--primary); font-size: 0.95rem; }
        .checkout-item .info .name { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
        .checkout-item .price { font-weight: 700; color: var(--text); }
        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.85rem;
            margin-top: 0.85rem;
            border-top: 2px solid var(--primary);
        }
        .total-row .label { font-weight: 600; color: var(--text); font-size: 0.95rem; }
        .total-row .value { font-weight: 800; color: var(--primary); font-size: 1.3rem; }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text); margin-bottom: 0.25rem; }
        .form-group input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 0.95rem; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,135,81,0.15); }
        .form-group small { color: var(--muted); font-size: 0.75rem; display: block; margin-top: 0.25rem; }

        .btn { width: 100%; padding: 0.85rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; font-family: inherit; transition: background 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .loader { display: inline-block; width: 20px; height: 20px; border: 3px solid #e5e7eb; border-radius: 50%; border-top-color: #ffffff; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; max-width: 380px; width: 100%; }
        .toast { background: var(--card); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 0.75rem; box-shadow: 0 8px 30px rgba(0,0,0,0.12); border-left: 4px solid var(--primary); display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; }
        .toast.error { border-left-color: #dc2626; }
        .toast.warning { border-left-color: #f59e0b; }
        .toast.success { border-left-color: #22c55e; }
        .toast .toast-close { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 1rem; margin-left: auto; }

        @media (max-width: 640px) {
            .navbar { padding: 0.75rem 1rem; flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            .navbar .nav-links { width: 100%; gap: 0.75rem; font-size: 0.8rem; flex-wrap: wrap; }
            .navbar .nav-links a { font-size: 0.8rem; }
            .container { padding: 1rem; }
            .checkout-card { padding: 1.25rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="../../index.html" class="brand">Course<span>Mate</span></a>
        <div class="nav-links" id="navLinks"></div>
    </nav>

    <div id="toastContainer" class="toast-container"></div>

    <div class="container">
        <div class="checkout-card">
            <div class="title"><i class="fas fa-credit-card" style="color: var(--primary);"></i> Checkout</div>

            <!-- Cart items list -->
            <div id="itemsList" class="items-list">
                <div class="items-title">Your Items</div>
                <div id="itemsContent"><p style="color: var(--muted); font-size: 0.9rem;">Loading...</p></div>
            </div>

            <form id="checkoutForm">
                <div class="form-group">
                    <label for="studentName">Full Name <span style="color: #dc2626;">*</span></label>
                    <input type="text" id="studentName" placeholder="Enter your full name" required />
                </div>
                <div class="form-group">
                    <label for="matricNumber">Matric Number <span style="color: #dc2626;">*</span></label>
                    <input type="text" id="matricNumber" placeholder="e.g., NOU123456789" required />
                </div>
                <div class="form-group">
                    <label for="email">Email Address <span style="color: #dc2626;">*</span></label>
                    <input type="email" id="email" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number <span style="color: #dc2626;">*</span></label>
                    <input type="tel" id="phone" placeholder="080 123 4567" required />
                </div>
                <div class="form-group">
                    <label for="programme">Programme (Degree) <span style="color: #dc2626;">*</span></label>
                    <input type="text" id="programme" placeholder="e.g., Information Technology" required />
                </div>
                <div class="form-group">
                    <label for="level">Level <span style="color: #dc2626;">*</span></label>
                    <input type="text" id="level" placeholder="e.g., 100 Level" required />
                </div>
                <div class="form-group">
                    <label for="group">Group (optional)</label>
                    <input type="text" id="group" placeholder="e.g., Group A" />
                </div>
                <div class="form-group">
                    <label for="department">Department (optional)</label>
                    <input type="text" id="department" placeholder="e.g., Computer Science" />
                </div>
                <div class="form-group">
                    <label for="studyCentre">Study Centre (optional)</label>
                    <input type="text" id="studyCentre" placeholder="e.g., Ikorodu Study Centre" />
                </div>

                <button type="submit" id="payBtn" class="btn btn-primary">
                    <i class="fas fa-credit-card"></i> Pay Now
                </button>
            </form>

            <div id="paymentStatus" class="hidden" style="text-align: center; margin-top: 1rem;">
                <div class="loader" style="border-top-color: var(--primary);"></div>
                <p style="color: var(--muted); margin-top: 0.5rem;">Processing payment...</p>
            </div>
        </div>
    </div>

    <script>
        var supabaseUrl = "https://mbniynyvcxzspjmzgovp.supabase.co";
        var supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibml5bnl2Y3h6c3BqbXpnb3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMTY5MTksImV4cCI6MjEwMDU5MjkxOX0.cp3F1zyJg0BAqPD0iLDbW2YHOD6JLZWtkthHINMX0RA";
        var supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        var PAYSTACK_KEY = 'pk_test_bab718f93005134c2437a6f9fe83f3f8db6d966a';
        var CART_KEY = 'logbookCart';

        var cartItems = [];

        // ============================================================
        // CART
        // ============================================================
        function getCart() {
            try {
                var data = localStorage.getItem(CART_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }

        function clearCart() {
            localStorage.removeItem(CART_KEY);
        }

        function renderItems() {
            cartItems = getCart();
            var container = document.getElementById('itemsContent');

            if (cartItems.length === 0) {
                container.innerHTML = '<p style="color: var(--muted); font-size: 0.9rem;">Your cart is empty.</p>';
                setTimeout(function() { window.location.href = 'shop.html'; }, 2000);
                return;
            }

            var total = 0;
            var html = '';
            cartItems.forEach(function(item) {
                total += Number(item.price) || 0;
                html += '<div class="checkout-item">' +
                    '<div class="info">' +
                        '<span class="code">' + item.code + '</span>' +
                        '<span class="name">' + item.name + '</span>' +
                    '</div>' +
                    '<span class="price">₦' + (item.price || 0).toLocaleString() + '</span>' +
                '</div>';
            });

            html += '<div class="total-row">' +
                '<span class="label">Total (' + cartItems.length + ' ' + (cartItems.length === 1 ? 'item' : 'items') + ')</span>' +
                '<span class="value">₦' + total.toLocaleString() + '</span>' +
            '</div>';

            container.innerHTML = html;
        }

        // ============================================================
        // NAVBAR
        // ============================================================
        function renderNavbar() {
            var navLinks = document.getElementById('navLinks');
            var isTutorialStudent = localStorage.getItem('isTutorialStudent') === 'true';
            var adminEmail = localStorage.getItem('adminEmail');
            var isMobile = window.innerWidth < 640;
            var html = '';
            var count = getCart().length;

            if (adminEmail) {
                html += '<a href="/admin/dashboard.html"><i class="fas fa-tachometer-alt"></i> Admin</a>';
                html += '<a href="shop.html"><i class="fas fa-book"></i> Shop</a>';
            } else if (isTutorialStudent) {
                html += '<a href="../../student/dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>';
                html += '<a href="shop.html"><i class="fas fa-book"></i> Shop</a>';
                html += '<a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart' + (count > 0 ? ' <span class="cart-badge">' + count + '</span>' : '') + '</a>';
                html += '<a href="my-orders.html"><i class="fas fa-list"></i> My Orders</a>';
            } else {
                html += '<a href="../../index.html"><i class="fas fa-home"></i> Home</a>';
                html += '<a href="shop.html"><i class="fas fa-book"></i> Shop</a>';
                html += '<a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart' + (count > 0 ? ' <span class="cart-badge">' + count + '</span>' : '') + '</a>';
                html += '<a href="my-orders.html"><i class="fas fa-list"></i> My Orders</a>';
                if (!isMobile) html += '<a href="../../login.html"><i class="fas fa-sign-in-alt"></i> Login</a>';
            }
            navLinks.innerHTML = html;
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type) {
            type = type || 'info';
            var container = document.getElementById('toastContainer');
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            var icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
            toast.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '" style="color: var(--primary);"></i><span style="flex:1;">' + message + '</span><button class="toast-close" onclick="this.parentElement.remove()">&times;</button>';
            container.appendChild(toast);
            setTimeout(function() { if (toast.parentElement) toast.remove(); }, 5000);
        }

        // ============================================================
        // ORDER NUMBER
        // ============================================================
        function generateOrderNumber() {
            var date = new Date();
            var year = date.getFullYear();
            var month = String(date.getMonth() + 1).padStart(2, '0');
            var day = String(date.getDate()).padStart(2, '0');
            var random = String(Math.floor(1000 + Math.random() * 9000));
            return 'CMT-' + year + month + day + '-' + random;
        }

        // ============================================================
        // SUBMIT
        // ============================================================
        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (cartItems.length === 0) {
                showToast('Your cart is empty.', 'error');
                return;
            }

            var studentName = document.getElementById('studentName').value.trim();
            var matricNumber = document.getElementById('matricNumber').value.trim().toUpperCase();
            var email = document.getElementById('email').value.trim();
            var phone = document.getElementById('phone').value.trim();
            var department = document.getElementById('department').value.trim();
            var programme = document.getElementById('programme').value.trim();
            var level = document.getElementById('level').value.trim();
            var group = document.getElementById('group').value.trim();
            var studyCentre = document.getElementById('studyCentre').value.trim();

            if (!studentName || !matricNumber || !email || !phone || !programme || !level) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            // NOUN matric format check
            var matricRegex = /^NOU\d{9}$/;
            if (!matricRegex.test(matricNumber)) {
                showToast('Invalid Matric Number. Format: NOU + 9 digits (e.g., NOU123456789).', 'error');
                return;
            }

            var payBtn = document.getElementById('payBtn');
            var statusDiv = document.getElementById('paymentStatus');

            payBtn.disabled = true;
            payBtn.innerHTML = '<div class="loader"></div> Processing...';
            statusDiv.classList.remove('hidden');

            var orderNumber = generateOrderNumber();
            var deliveryDate = new Date();
            deliveryDate.setHours(deliveryDate.getHours() + 48);

            var totalAmount = 0;
            cartItems.forEach(function(item) { totalAmount += Number(item.price) || 0; });

            // Build items summary string
            var itemCodes = cartItems.map(function(i) { return i.code; }).join(', ');
            var itemNames = cartItems.map(function(i) { return i.code + ' - ' + i.name; }).join(' | ');

            // Save order to database
            supabaseClient
                .from('logbook_orders')
                .insert([{
                    order_number: orderNumber,
                    student_name: studentName,
                    matric_number: matricNumber,
                    email: email,
                    phone: phone,
                    department: department,
                    study_centre: studyCentre,
                    programme: programme,
                    level: level,
                    student_group: group,
                    logbook_code: itemCodes,
                    logbook_name: itemNames,
                    amount: totalAmount,
                    order_date: new Date().toISOString(),
                    delivery_date: deliveryDate.toISOString(),
                    status: 'pending',
                    order_type: 'normal'
                }])
                .select()
                .single()
                .then(function(result) {
                    if (result.error) throw result.error;

                    var reference = 'LOG-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

                    var handler = PaystackPop.setup({
                        key: PAYSTACK_KEY,
                        email: email,
                        amount: totalAmount * 100,
                        currency: 'NGN',
                        ref: reference,
                        metadata: {
                            custom_fields: [
                                { display_name: "Order Number", variable_name: "order_number", value: orderNumber },
                                { display_name: "Items", variable_name: "items", value: itemCodes }
                            ]
                        },
                        callback: function(response) {
                            supabaseClient
                                .from('logbook_orders')
                                .update({
                                    payment_reference: response.reference,
                                    status: 'accepted'
                                })
                                .eq('order_number', orderNumber)
                                .then(function() {
                                    // Save last order data
                                    sessionStorage.setItem('lastOrder', JSON.stringify({
                                        orderNumber: orderNumber,
                                        studentName: studentName,
                                        email: email,
                                        logbook: itemCodes,
                                        logbookName: itemNames,
                                        itemsCount: cartItems.length,
                                        amount: totalAmount,
                                        orderDate: new Date().toLocaleDateString(),
                                        deliveryDate: deliveryDate.toLocaleDateString()
                                    }));

                                    localStorage.setItem('studentEmail', email);
                                    localStorage.setItem('studentName', studentName);

                                    // Clear cart
                                    clearCart();

                                    window.location.href = 'confirmation.html';
                                })
                                .catch(function() {
                                    clearCart();
                                    window.location.href = 'confirmation.html';
                                });
                        },
                        onClose: function() {
                            showToast('Payment cancelled. Try again.', 'warning');
                            payBtn.disabled = false;
                            payBtn.innerHTML = '<i class="fas fa-credit-card"></i> Pay Now';
                            statusDiv.classList.add('hidden');
                        }
                    });

                    handler.openIframe();
                })
                .catch(function(error) {
                    console.error('Order error:', error);
                    showToast('Failed to place order: ' + (error.message || 'Unknown error'), 'error');
                    payBtn.disabled = false;
                    payBtn.innerHTML = '<i class="fas fa-credit-card"></i> Pay Now';
                    statusDiv.classList.add('hidden');
                });
        });

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderNavbar();
            renderItems();
        });
    </script>
</body>
</html>
