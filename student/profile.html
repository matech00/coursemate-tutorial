<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - CourseMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== LIGHT & DARK THEME ===== */
        :root {
            --bg: #f9fafb;
            --card: #ffffff;
            --text: #111827;
            --border: #e5e7eb;
            --muted: #6b7280;
            --shadow: 0 2px 8px rgba(0,0,0,0.02);
            --hover-bg: #f3f4f6;
            --primary: #008751;
            --primary-light: #E8F5E9;
            --primary-dark: #006d3f;
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
            --muted: #94a3b8;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --hover-bg: #2d3748;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100%;
            background: var(--card);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease, background 0.3s, border 0.3s;
        }
        .sidebar .brand { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 2rem; }
        .sidebar .brand span { font-weight: 300; color: var(--text); }
        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            color: var(--text);
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
            font-size: 0.95rem;
        }
        .sidebar nav a:hover { background: var(--primary-light); color: var(--primary); }
        .sidebar nav a.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .sidebar nav a i { width: 1.25rem; text-align: center; }
        .sidebar .logout-btn, .sidebar .theme-toggle {
            margin-top: 0.5rem;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text);
            transition: background 0.2s;
        }
        .sidebar .logout-btn:hover { background: #fee2e2; color: #dc2626; }
        .sidebar .theme-toggle:hover { background: var(--hover-bg); }
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 99;
            display: none;
        }
        .sidebar-overlay.active { display: block; }
        .main-content {
            margin-left: 260px;
            padding: 1.5rem 2rem;
            min-height: 100vh;
            transition: background 0.3s;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--primary-light);
        }
        .topbar .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text);
            cursor: pointer;
            padding: 0.25rem 0.5rem;
        }
        .topbar .edit-link {
            font-size: 0.9rem;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-weight: 500;
        }
        .topbar .edit-link:hover { color: var(--primary-dark); }
        .profile-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.75rem;
            max-width: 700px;
            margin: 0 auto;
            box-shadow: var(--shadow);
            transition: background 0.3s, border 0.3s;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 40px;
            color: var(--primary);
            margin: 0 auto 1rem;
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
        }
        .profile-id {
            text-align: center;
            font-size: 0.9rem;
            color: var(--muted);
            margin-top: 0.1rem;
        }
        .profile-status {
            text-align: center;
            margin-top: 0.5rem;
        }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.75rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge-paid { background: #d1fae5; color: #065f46; }
        .badge-monthly { background: #fef3c7; color: #92400e; }
        .badge-expired { background: #fee2e2; color: #991b1b; }
        .badge-pending { background: #f3f4f6; color: #6b7280; }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem 1.5rem;
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
        }
        @media (max-width: 480px) { .info-grid { grid-template-columns: 1fr; } }
        .info-item label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            font-weight: 600;
        }
        .info-item .value {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
        }
        .attendance-stats {
            text-align: center;
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--muted);
        }
        .attendance-stats i { color: var(--primary); margin-right: 0.4rem; }
        .attendance-stats span { font-weight: 600; color: var(--primary); }
        .loader {
            width: 30px;
            height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .text-center { text-align: center; }
        .text-muted { color: var(--muted); }
        .text-sm { font-size: 0.875rem; }
        .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mb-4 { margin-bottom: 1rem; }
        .text-red-500 { color: #ef4444; }
        .hidden { display: none; }
        .flex-center { display: flex; align-items: center; gap: 0.5rem; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 75%; max-width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 1rem; }
            .topbar .menu-toggle { display: block; }
        }
        @media (min-width: 769px) { .sidebar-overlay { display: none !important; } }
        .text-primary { color: var(--primary); }
        .bg-primary-light { background: var(--primary-light); }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .text-xl { font-size: 1.25rem; }
        .gap-2 { gap: 0.5rem; }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="brand">Course<span>Mate</span></div>
        <nav>
            <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
            <a href="profile.html" class="active"><i class="fas fa-user"></i> Profile</a>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
            <a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
            <a href="attendance.html"><i class="fas fa-clipboard-list"></i> Attendance</a>
            <a href="qr.html"><i class="fas fa-qrcode"></i> My QR Code</a>
            <a href="id-card.html"><i class="fas fa-id-card"></i> ID Card</a>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()">
            <i class="fas fa-moon"></i> Dark Mode
        </button>
        <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </aside>

    <div class="main-content">
        <div class="topbar">
            <div class="flex-center">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 class="text-xl font-bold" style="margin:0;">My Profile</h1>
            </div>
            <a href="settings.html" class="edit-link"><i class="fas fa-edit"></i> Edit Profile</a>
        </div>

        <div class="profile-card">
            <div id="loading-state" class="text-center py-8">
                <div class="loader"></div>
                <p class="text-muted mt-2" style="font-size:0.9rem;">Loading profile...</p>
            </div>

            <div id="profile-content" style="display:none;">
                <div class="profile-avatar" id="avatar-container">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <div class="profile-name" id="display-name">—</div>
                <div class="profile-id">Student ID: <span id="display-student-id">—</span></div>
                <div class="profile-status"><span class="badge" id="status-badge">Pending</span></div>

                <div class="info-grid">
                    <div class="info-item"><label>Email</label><div class="value" id="display-email">—</div></div>
                    <div class="info-item"><label>Phone</label><div class="value" id="display-phone">—</div></div>
                    <div class="info-item"><label>Department</label><div class="value" id="display-dept">—</div></div>
                    <div class="info-item"><label>Program</label><div class="value" id="display-program">—</div></div>
                    <div class="info-item"><label>Level</label><div class="value" id="display-level">—</div></div>
                    <div class="info-item"><label>Joined</label><div class="value" id="display-joined">—</div></div>
                </div>

                <div class="attendance-stats">
                    <i class="fas fa-calendar-check"></i> Attendance: <span id="attendance-stats">0% (0/0)</span>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) closeSidebar();
        });

        function loadTheme() {
            const dark = localStorage.getItem('theme') === 'dark';
            document.body.classList.toggle('dark', dark);
            const icon = document.querySelector('.theme-toggle i');
            if (icon) icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const icon = document.querySelector('.theme-toggle i');
            if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }
        document.addEventListener('DOMContentLoaded', loadTheme);

        window.handleLogout = async function() {
            try { await window.supabaseClient.auth.signOut(); window.location.href = '../login.html'; } catch (e) { window.location.href = '../login.html'; }
        };

        const supabaseClient = window.supabaseClient || (() => {
            const url = window.SUPABASE_URL || "https://mbniynyvcxzspjmzgovp.supabase.co";
            const key = window.SUPABASE_ANON_KEY || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibml5bnl2Y3h6c3BqbXpnb3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMTY5MTksImV4cCI6MjEwMDU5MjkxOX0.cp3F1zyJg0BAqPD0iLDbW2YHOD6JLZWtkthHINMX0RA";
            return window.supabase.createClient(url, key);
        })();

        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const user = await window.auth.getCurrentUser();
                if (!user) { window.location.href = '../login.html'; return; }

                // Fetch student details
                const { data: student, error } = await supabaseClient
                    .from('students')
                    .select('*')
                    .eq('user_id', user.id)
                    .single();

                if (error || !student) {
                    document.getElementById('loading-state').innerHTML = '<p class="text-red-500">Profile not found.</p>';
                    return;
                }

                document.getElementById('display-name').textContent = student.full_name || '—';
                document.getElementById('display-student-id').textContent = student.student_id || '—';
                document.getElementById('display-email').textContent = student.email || user.email || '—';
                document.getElementById('display-phone').textContent = student.phone || '—';
                document.getElementById('display-level').textContent = student.level || '—';
                document.getElementById('display-joined').textContent = student.created_at ? new Date(student.created_at).toLocaleDateString() : '—';

                // 🟢 FIX: Department and Program are stored as names, so display them directly
                document.getElementById('display-dept').textContent = student.department || '—';
                document.getElementById('display-program').textContent = student.program || '—';

                const status = student.payment_status || 'pending';
                const map = {
                    'paid': { label: 'Fully Paid', cls: 'badge-paid' },
                    'monthly_active': { label: 'Monthly Active', cls: 'badge-monthly' },
                    'expired': { label: 'Expired', cls: 'badge-expired' },
                    'pending': { label: 'Pending', cls: 'badge-pending' }
                };
                const info = map[status] || map['pending'];
                const badge = document.getElementById('status-badge');
                badge.textContent = info.label;
                badge.className = 'badge ' + info.cls;

                const avatarContainer = document.getElementById('avatar-container');
                if (student.avatar_url) {
                    avatarContainer.innerHTML = `<img src="${student.avatar_url}?t=${Date.now()}" alt="Avatar" />`;
                } else {
                    avatarContainer.innerHTML = `<i class="fas fa-user-graduate"></i>`;
                }

                const { data: attendance, error: attErr } = await supabaseClient
                    .from('attendance')
                    .select('status')
                    .eq('student_id', student.id);
                if (!attErr && attendance) {
                    const total = attendance.length;
                    const present = attendance.filter(a => a.status === 'present').length;
                    const pct = total ? Math.round((present / total) * 100) : 0;
                    document.getElementById('attendance-stats').textContent = `${pct}% (${present}/${total})`;
                }

                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('profile-content').style.display = 'block';

            } catch (err) {
                console.error(err);
                document.getElementById('loading-state').innerHTML = '<p class="text-red-500">Failed to load profile.</p>';
            }
        });
    </script>
</body>
</html>
