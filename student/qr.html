<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My QR Code - CourseMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Add this after the CSS links -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        /* ===== LIGHT & DARK THEME ===== */
        :root {
            --bg: #f9fafb;
            --card: #ffffff;
            --text: #111827;
            --border: #e5e7eb;
            --muted: #6b7280;
            --shadow: 0 2px 8px rgba(0,0,0,0.02);
            --hover-bg: #f3f4f6;
            --primary: #008751;
            --primary-light: #E8F5E9;
            --primary-dark: #006d3f;
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
            --muted: #94a3b8;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --hover-bg: #2d3748;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100%;
            background: var(--card);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease, background 0.3s, border 0.3s;
        }
        .sidebar .brand { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 2rem; }
        .sidebar .brand span { font-weight: 300; color: var(--text); }
        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            color: var(--text);
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
            font-size: 0.95rem;
        }
        .sidebar nav a:hover { background: var(--primary-light); color: var(--primary); }
        .sidebar nav a.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .sidebar nav a i { width: 1.25rem; text-align: center; }
        .sidebar .logout-btn, .sidebar .theme-toggle {
            margin-top: 0.5rem;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text);
            transition: background 0.2s;
        }
        .sidebar .logout-btn:hover { background: #fee2e2; color: #dc2626; }
        .sidebar .theme-toggle:hover { background: var(--hover-bg); }
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 99;
            display: none;
        }
        .sidebar-overlay.active { display: block; }
        /* ===== MAIN ===== */
        .main-content {
            margin-left: 260px;
            padding: 1.5rem 2rem;
            min-height: 100vh;
            transition: background 0.3s;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--primary-light);
        }
        .topbar .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text);
            cursor: pointer;
            padding: 0.25rem 0.5rem;
        }
        /* ===== QR CARD ===== */
        .qr-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            max-width: 400px;
            margin: 1rem auto;
            text-align: center;
            box-shadow: var(--shadow);
            transition: background 0.3s, border 0.3s;
        }
        .qr-card .heading {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
        }
        .qr-card .subheading {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 1.25rem;
        }
        .qr-container {
            background: white;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: inline-block;
            margin: 0 auto 0.75rem;
        }
        .qr-container canvas, .qr-container img {
            width: 160px !important;
            height: 160px !important;
            display: block;
        }
        .student-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-top: 0.5rem;
        }
        .student-id {
            font-size: 0.8rem;
            color: var(--muted);
            font-family: monospace;
            letter-spacing: 0.04em;
        }
        .loader {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .text-center { text-align: center; }
        .text-muted { color: var(--muted); }
        .text-red-500 { color: #ef4444; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .mt-2 { margin-top: 0.5rem; }
        .hidden { display: none; }
        .flex-center { display: flex; align-items: center; gap: 0.5rem; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 75%; max-width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 1rem; }
            .topbar .menu-toggle { display: block; }
        }
        @media (min-width: 769px) { .sidebar-overlay { display: none !important; } }
        .text-primary { color: var(--primary); }
        .text-xl { font-size: 1.25rem; }
        .font-bold { font-weight: 700; }
    </style>
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="brand">Course<span>Mate</span></div>
        <nav>
            <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
            <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
            <a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
            <a href="attendance.html"><i class="fas fa-clipboard-list"></i> Attendance</a>
            <a href="qr.html" class="active"><i class="fas fa-qrcode"></i> My QR Code</a>
            <a href="id-card.html"><i class="fas fa-id-card"></i> ID Card</a>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()">
            <i class="fas fa-moon"></i> Dark Mode
        </button>
        <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </aside>

    <!-- ===== MAIN ===== -->
    <div class="main-content">
        <div class="topbar">
            <div class="flex-center">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 class="text-xl font-bold" style="margin:0;">My QR Code</h1>
            </div>
            <a href="dashboard.html" class="text-sm text-muted" style="text-decoration:none;"><i class="fas fa-arrow-left"></i> Dashboard</a>
        </div>

        <div class="qr-card">
            <div id="loading-state" class="py-4">
                <div class="loader"></div>
                <p class="text-muted mt-2" style="font-size:0.85rem;">Loading your QR code...</p>
            </div>
            <div id="qr-content" style="display:none;">
                <div class="heading"><i class="fas fa-qrcode" style="color:var(--primary);"></i> My QR Code</div>
                <div class="subheading">Scan to mark attendance</div>
                <div class="qr-container" id="qr-container">
                    <div id="qr-placeholder" style="width:160px;height:160px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:0.9rem;">Generating...</div>
                </div>
                <div class="student-name" id="student-name">—</div>
                <div class="student-id" id="student-id">—</div>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        // ===== SIDEBAR =====
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) closeSidebar();
        });

        // ===== DARK MODE =====
        function loadTheme() {
            const dark = localStorage.getItem('theme') === 'dark';
            document.body.classList.toggle('dark', dark);
            const icon = document.querySelector('.theme-toggle i');
            if (icon) icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const icon = document.querySelector('.theme-toggle i');
            if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }
        document.addEventListener('DOMContentLoaded', loadTheme);

        // ===== LOGOUT =====
        window.handleLogout = async function() {
            try { await window.supabaseClient.auth.signOut(); window.location.href = '../login.html'; } catch (e) { window.location.href = '../login.html'; }
        };

        // ===== SUPABASE CLIENT =====
        const supabaseClient = window.supabaseClient || (() => {
            const url = window.SUPABASE_URL || "https://mbniynyvcxzspjmzgovp.supabase.co";
            const key = window.SUPABASE_ANON_KEY || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibml5bnl2Y3h6c3BqbXpnb3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMTY5MTksImV4cCI6MjEwMDU5MjkxOX0.cp3FzyJg0BAqPD0iLDbW2YHOD6JLZWtkthHINMX0RA";
            return window.supabase.createClient(url, key);
        })();

        // ===== LOAD QR =====
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const user = await window.auth.getCurrentUser();
                if (!user) { window.location.href = '../login.html'; return; }

                const { data: student, error } = await supabaseClient
                    .from('students')
                    .select('full_name, student_id')
                    .eq('user_id', user.id)
                    .single();

                if (error || !student) {
                    document.getElementById('loading-state').innerHTML = '<p class="text-red-500">Student profile not found.</p>';
                    return;
                }

                document.getElementById('student-name').textContent = student.full_name || '—';
                document.getElementById('student-id').textContent = student.student_id || '—';

                const placeholder = document.getElementById('qr-placeholder');
                if (student.student_id) {
                    placeholder.innerHTML = '';
                    new QRCode(placeholder, {
                        text: student.student_id,
                        width: 160,
                        height: 160,
                        colorDark: '#008751',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } else {
                    placeholder.innerHTML = '<span style="font-size:0.8rem;color:#94a3b8;">No ID assigned</span>';
                }

                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('qr-content').style.display = 'block';

            } catch (err) {
                console.error(err);
                document.getElementById('loading-state').innerHTML = '<p class="text-red-500">Failed to load QR code.</p>';
            }
        });
    </script>
</body>
</html>
