<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <style>
        body { background: #f9fafb; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: #008751; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .text-center { text-align: center; }
        .text-muted { color: #6b7280; }
        .mt-4 { margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="text-center">
        <div class="spinner"></div>
        <p class="text-muted mt-4">Logging you in...</p>
    </div>

    <script>
        (async function() {
            try {
                const { data: { session }, error } = await window.supabaseClient.auth.getSession();
                if (error) throw error;

                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }

                const user = session.user;

                // Check if admin
                const { data: admin } = await window.supabaseClient
                    .from('admins')
                    .select('user_id')
                    .eq('user_id', user.id)
                    .maybeSingle();

                if (admin) {
                    window.location.href = 'admin/dashboard.html';
                    return;
                }

                // Check if student record exists
                const { data: student } = await window.supabaseClient
                    .from('students')
                    .select('user_id, is_tutorial_student, payment_status')
                    .eq('user_id', user.id)
                    .maybeSingle();

                // If no student record, create one
                if (!student) {
                    const { error: insertError } = await window.supabaseClient
                        .from('students')
                        .insert({
                            user_id: user.id,
                            full_name: user.user_metadata?.full_name || user.email?.split('@')[0] || 'Student',
                            email: user.email,
                            phone: '',
                            department: '',
                            program: '',
                            level: '',
                            payment_status: null,
                            is_tutorial_student: false
                        });

                    if (insertError) {
                        console.error('Failed to create student record:', insertError);
                        window.location.href = 'login.html';
                        return;
                    }

                    // Logbook buyer → shop
                    window.location.href = 'student/logbook/shop.html';
                    return;
                }

                // If logbook buyer (is_tutorial_student = false) → shop
                if (student.is_tutorial_student === false) {
                    window.location.href = 'student/logbook/shop.html';
                    return;
                }

                // If tutorial student → check payment
                if (student.payment_status === 'pending' || student.payment_status === 'expired') {
                    window.location.href = 'payment.html';
                    return;
                }

                // Paid tutorial student → dashboard
                window.location.href = 'student/dashboard.html';

            } catch (err) {
                console.error('Redirect error:', err);
                window.location.href = 'login.html';
            }
        })();
    </script>
</body>
</html>
