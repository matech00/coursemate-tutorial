<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password - CourseMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="assets/images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body { background: #f9fafb; font-family: 'Inter', system-ui, sans-serif; }
        .card { background: white; border-radius: 16px; padding: 2rem; max-width: 420px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; }
        .btn-primary { background: #008751; color: white; }
        .btn-primary:hover { background: #006d3f; }

        /* ===== BRAND MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 1rem;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            padding: 2rem 1.5rem 1.5rem;
            box-shadow: 0 24px 60px rgba(0,0,0,0.25);
            animation: fadeIn 0.25s ease;
            text-align: center;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-icon { font-size: 3rem; margin-bottom: 0.5rem; }
        .modal-icon.success { color: #22c55e; }
        .modal-icon.error { color: #ef4444; }
        .modal-title { font-size: 1.25rem; font-weight: 700; color: #1a202c; }
        .modal-message { color: #4a5568; font-size: 0.95rem; margin: 0.25rem 0 1.25rem; }
        .modal-btn {
            padding: 0.4rem 1.5rem;
            border: none;
            border-radius: 8px;
            background: #008751;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }
        .modal-btn:hover { background: #006d3f; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="card">
        <div class="text-center mb-6">
            <i class="fas fa-lock text-4xl text-primary-500 mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-900">Set New Password</h2>
            <p class="text-gray-600 mt-1">Enter your new password below.</p>
        </div>

        <div id="error-message" class="hidden bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm"></div>

        <form id="resetForm">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                <input type="password" id="newPassword" placeholder="••••••••" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none" required />
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none" required />
            </div>
            <button type="submit" id="update-btn" class="w-full py-3 btn-primary rounded-lg font-semibold">
                <i class="fas fa-check mr-2"></i>Update Password
            </button>
        </form>

        <div class="text-center mt-6 text-sm text-gray-600">
            Remember your password? <a href="login.html" class="text-primary-500 font-semibold hover:underline">Login</a>
        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div class="modal-icon" id="modal-icon"><i class="fas fa-check-circle"></i></div>
            <div class="modal-title" id="modal-title">Success</div>
            <div class="modal-message" id="modal-message">Your action was completed.</div>
            <button class="modal-btn" id="modal-btn">OK</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================
        // SUPABASE CLIENT
        // ============================================
        const SUPABASE_URL = "https://mbniynyvcxzspjmzgovp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibml5bnl2Y3h6c3BqbXpnb3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMTY5MTksImV4cCI6MjEwMDU5MjkxOX0.cp3F1zyJg0BAqPD0iLDbW2YHOD6JLZWtkthHINMX0RA";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================
        // MODAL
        // ============================================
        const modal = document.getElementById('modal');
        const modalIcon = document.getElementById('modal-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalBtn = document.getElementById('modal-btn');

        function showModal(icon, title, message, type = 'success') {
            modalIcon.innerHTML = `<i class="fas ${icon}"></i>`;
            modalIcon.className = 'modal-icon ' + type;
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modal.classList.add('active');
            setTimeout(() => modal.classList.remove('active'), 4000);
        }
        modalBtn.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        // ============================================
        // TOKEN EXTRACTION
        // ============================================
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');
        const errorDiv = document.getElementById('error-message');

        if (!accessToken) {
            errorDiv.textContent = '❌ Invalid or missing reset token. Please request a new password reset.';
            errorDiv.classList.remove('hidden');
            document.getElementById('update-btn').disabled = true;
        }

        // ============================================
        // FORM
        // ============================================
        const form = document.getElementById('resetForm');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 6) {
                showModal('fa-exclamation-triangle', 'Invalid Password', 'Password must be at least 6 characters.', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showModal('fa-exclamation-triangle', 'Passwords Mismatch', 'Passwords do not match.', 'error');
                return;
            }

            const btn = document.getElementById('update-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Updating...';

            try {
                // Set session using token
                const { error: sessionError } = await supabaseClient.auth.setSession({
                    access_token: accessToken,
                    refresh_token: refreshToken,
                });
                if (sessionError) throw sessionError;

                // Update password
                const { error: updateError } = await supabaseClient.auth.updateUser({
                    password: newPassword,
                });
                if (updateError) throw updateError;

                showModal('fa-check-circle', '✅ Password Updated', 'You can now login with your new password.', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (err) {
                console.error(err);
                showModal('fa-exclamation-circle', '❌ Error', 'Failed to update password: ' + err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check mr-2"></i>Update Password';
            }
        });
    </script>
</body>
</html>
